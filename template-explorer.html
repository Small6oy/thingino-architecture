<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__ · Explorer</title>
<!-- Layout C "Explorer". Generated by build.py from architecture.toml; edit the data or this template. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell. Header with camera/firmware switches and tabs; Explore tab = parts list | stack minimap + focus graph | details. */
:root {
  --bg: #f2f3f6; --panel: #ffffff; --raise: #f7f8fa; --ink: #16181d; --muted: #616672; --line: #e0e3e9;
  --accent: #3150d4; --accent-soft: #e6eafc;
  --video: #3150d4; --audio: #bf600b; --control: #737a88; --detect: #b5338a;
  --f-sans: "Manrope", "Segoe UI", Helvetica, Arial, sans-serif;
  --f-mono: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --panel: #171a20; --raise: #1d2128; --ink: #e8eaef; --muted: #959baa; --line: #2a2f38;
    --accent: #8197ff; --accent-soft: #232b4d; --video: #8197ff; --audio: #f0a050; --control: #98a0ae; --detect: #ee77c4; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --panel: #171a20; --raise: #1d2128; --ink: #e8eaef; --muted: #959baa; --line: #2a2f38;
  --accent: #8197ff; --accent-soft: #232b4d; --video: #8197ff; --audio: #f0a050; --control: #98a0ae; --detect: #ee77c4; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-sans); font-size: 14px; line-height: 1.55; }
code { font-family: var(--f-mono); font-size: 0.9em; background: var(--raise); padding: 0 3px; border-radius: 3px; }
a { color: var(--accent); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 1520px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }

/* header */
.top { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px 0; display: grid; gap: 14px; }
.top-row { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: flex-start; justify-content: space-between; }
.title { display: grid; gap: 2px; min-width: 0; }
.title b { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; }
.title span { font-size: 13px; color: var(--muted); }
.ctrl { display: flex; flex-wrap: wrap; gap: 12px 20px; }
.ctl { display: grid; gap: 5px; }
.ctl > span { font-family: var(--f-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.segs { display: flex; flex-wrap: wrap; gap: 4px; padding: 3px; background: var(--raise); border: 1px solid var(--line); border-radius: 10px; }
.segs button { border: 0; background: none; padding: 5px 10px; border-radius: 7px; cursor: pointer; font-weight: 600; font-size: 13px; display: grid; text-align: left; line-height: 1.25; }
.segs button small { font-weight: 500; font-size: 11px; color: var(--muted); }
.segs button[aria-pressed="true"] { background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.12); color: var(--accent); }
.segs button:disabled { opacity: 0.4; cursor: not-allowed; }
.tabs { display: flex; gap: 2px; margin: 0 -18px; padding: 0 12px; border-top: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 11px 12px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

/* explore */
.explore { display: grid; grid-template-columns: 260px minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
@media (max-width: 1180px) { .explore { grid-template-columns: 240px minmax(0, 1fr); } .info { grid-column: 1 / -1; } }
@media (max-width: 760px) { .explore { grid-template-columns: minmax(0, 1fr); } }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.side { padding: 12px; display: grid; gap: 10px; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: hidden; grid-template-rows: auto minmax(0, 1fr) auto; }
@media (max-width: 760px) { .side { position: static; max-height: none; } #list { max-height: 260px; } }
.search { position: relative; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--raise); border-radius: 9px; padding: 8px 34px 8px 10px; }
.search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-family: var(--f-mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
#list { overflow: auto; display: grid; gap: 10px; align-content: start; padding-right: 2px; }
.grp h5 { margin: 0 0 3px; font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); display: flex; justify-content: space-between; }
.grp button { width: 100%; border: 0; background: none; border-radius: 7px; padding: 4px 8px; text-align: left; cursor: pointer; display: flex; gap: 8px; align-items: center; }
.grp button:hover { background: var(--raise); }
.grp button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.grp button i { width: 7px; height: 7px; border-radius: 50%; background: var(--k, var(--line)); flex: none; }
.grp button span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grp button em { font-style: normal; font-size: 11px; color: var(--muted); white-space: nowrap; }
.none { color: var(--muted); font-size: 13px; padding: 6px 8px; }
.cam-card { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 6px; }
.cam-card h5 { margin: 0; font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.cam-card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
.cam-card dt { color: var(--muted); }
.cam-card dd { margin: 0; overflow-wrap: anywhere; }

.focus { padding: 14px; display: grid; gap: 14px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); min-height: 28px; }
.crumbs button { border: 1px solid var(--line); background: var(--raise); border-radius: 7px; padding: 3px 9px; cursor: pointer; }
.crumbs button:disabled { opacity: .4; cursor: default; }
.crumbs .trail button { border: 0; background: none; padding: 0 2px; color: var(--muted); }
.crumbs .trail button:hover { color: var(--ink); text-decoration: underline; }
.stack { display: grid; gap: 3px; background: var(--raise); border-radius: 10px; padding: 10px; overflow-x: auto; }
.srow { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 10px; align-items: center; }
.srow > span { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow div { display: flex; flex-wrap: wrap; gap: 3px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 1px 6px; font-family: var(--f-mono); font-size: 11px; cursor: pointer; color: var(--muted); }
.chip.near { border-color: var(--accent); color: var(--ink); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--panel); }
@media (max-width: 560px) { .srow { grid-template-columns: minmax(0, 1fr); gap: 2px; } }

.ego { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(200px, 1.1fr) minmax(0, 1fr); gap: 56px; align-items: center; min-height: 240px; padding: 8px 0; }
@media (max-width: 640px) { .ego { grid-template-columns: minmax(0, 1fr); gap: 14px; } #egosvg { display: none; } }
#egosvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.side-col { display: grid; gap: 8px; position: relative; z-index: 1; }
.side-col > h6 { margin: 0; font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.nb { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 10px; cursor: pointer; text-align: left; display: grid; gap: 1px; transition: border-color .15s, transform .15s; }
.nb:hover { border-color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .nb:hover { transform: translateY(-1px); } }
.nb small { font-family: var(--f-mono); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.nb b { font-size: 14px; }
.nb span { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.nb span i { width: 12px; border-top: 2px solid var(--k); flex: none; }
.nb span i.dash { border-top-style: dashed; }
.mid { position: relative; z-index: 1; border: 2px solid var(--accent); background: var(--panel); border-radius: 16px; padding: 18px; text-align: center; display: grid; gap: 4px; }
.mid small { font-family: var(--f-mono); font-size: 10.5px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; }
.mid b { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; overflow-wrap: anywhere; }
.mid span { color: var(--muted); font-size: 13px; }
.empty { font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 10px; }
.edge { fill: none; stroke-width: 1.6; }
.edge.control { stroke-dasharray: 5 4; }

.info { padding: 16px; display: grid; gap: 16px; position: sticky; top: 12px; }
@media (max-width: 1180px) { .info { position: static; } }
.info .tag { font-family: var(--f-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
.info h3 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
.info h4 { margin: 0 0 4px; font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.info p { margin: 0; }
.info .sub { color: var(--muted); font-size: 13px; }
.info ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.pin { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }

/* other tabs */
.page { padding: 24px; display: grid; gap: 18px; }
.page h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
.page > p { margin: 0; color: var(--muted); max-width: 75ch; }
.tl { list-style: none; margin: 0; padding: 0; display: grid; }
.tl li { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 18px; position: relative; padding: 0 0 18px; }
.tl li::before { content: ""; position: absolute; left: 135px; top: 6px; bottom: 0; border-left: 2px solid var(--line); }
.tl li::after { content: ""; position: absolute; left: 130px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--panel); border: 2px solid var(--accent); }
.tl li:last-child::before { display: none; }
.tl .w { font-family: var(--f-mono); font-size: 12px; color: var(--accent); text-align: right; padding-top: 1px; overflow-wrap: anywhere; }
.tl .t { padding-left: 24px; display: grid; gap: 2px; min-width: 0; }
.tl .t p { margin: 0; color: var(--muted); }
@media (max-width: 560px) { .tl li { grid-template-columns: 76px minmax(0, 1fr); gap: 10px; } .tl li::before { left: 91px; } .tl li::after { left: 86px; } }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.steps li { counter-increment: s; background: var(--raise); border-radius: 12px; padding: 16px; display: grid; gap: 6px; align-content: start; }
.steps li::before { content: counter(s); font-size: 30px; font-weight: 800; color: var(--accent); line-height: 1; }
.steps p { margin: 0; color: var(--muted); }
.callout { background: var(--accent-soft); border-radius: 12px; padding: 14px 16px; margin: 0; max-width: 85ch; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 720px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); background: var(--raise); }
tr:last-child td { border-bottom: 0; }
td.mono { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.foot { margin: 0; color: var(--muted); font-size: 13px; max-width: 85ch; }
footer { font-family: var(--f-mono); font-size: 11px; color: var(--muted); padding: 0 4px; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="title"><b id="title"></b><span id="eyebrow"></span></div>
      <div class="ctrl">
        <div class="ctl"><span id="cam-label">Camera</span><div class="segs" id="cams" role="group" aria-labelledby="cam-label"></div></div>
        <div class="ctl"><span id="ver-label">Firmware</span><div class="segs" id="vers" role="group" aria-labelledby="ver-label"></div></div>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button type="button" role="tab" data-tab="explore" aria-selected="true">Explore</button>
      <button type="button" role="tab" data-tab="journey" aria-selected="false">Frame journey</button>
      <button type="button" role="tab" data-tab="boot" aria-selected="false">Boot order</button>
      <button type="button" role="tab" data-tab="sources" aria-selected="false">Sources</button>
    </nav>
  </header>

  <section class="explore" data-panel="explore">
    <aside class="pane side" aria-label="Parts">
      <label class="search"><input type="search" id="q" placeholder="Search parts" aria-label="Search parts"><kbd>/</kbd></label>
      <div id="list"></div>
      <div class="cam-card" id="camcard"></div>
    </aside>
    <section class="pane focus" aria-label="Focus">
      <div class="crumbs"><button type="button" id="back" disabled>← Back</button><span class="trail" id="trail"></span></div>
      <div class="stack" id="stack" aria-label="Whole stack"></div>
      <div class="ego" id="ego">
        <svg id="egosvg" aria-hidden="true"></svg>
        <div class="side-col" id="egoIn"></div>
        <div class="mid" id="egoMid"></div>
        <div class="side-col" id="egoOut"></div>
      </div>
    </section>
    <aside class="pane info" id="info" aria-live="polite"></aside>
  </section>

  <section class="pane page" data-panel="journey" hidden>
    <h2>A frame's journey</h2>
    <p id="lede"></p>
    <ol class="steps" id="journey"></ol>
    <p class="callout" id="callout"></p>
  </section>

  <section class="pane page" data-panel="boot" hidden>
    <h2>Boot order</h2>
    <ol class="tl" id="boot"></ol>
    <p class="foot" id="boot-foot"></p>
  </section>

  <section class="pane page" data-panel="sources" hidden>
    <h2>Where each piece comes from</h2>
    <p id="repos-intro"></p>
    <div class="tbl"><table><thead><tr><th>Piece</th><th>Upstream repo</th><th>Pinned</th><th>What it provides</th></tr></thead><tbody id="repos"></tbody></table></div>
    <p class="foot" id="repos-foot"></p>
  </section>

  <footer id="footer"></footer>
</div>

<script>/*__CORE__*/</script>
<script>
const DATA = /*__DATA__*/null;
(() => {
  const D = DATA, { esc, md } = TC, $ = id => document.getElementById(id);
  let V, sel = null, hist = [], query = '';
  let { cam, ver } = TC.fromHash(D);
  const K = k => `var(--${k === 'mixed' ? 'ink' : k})`;

  // ---------- switches ----------
  function switches() {
    $('cams').innerHTML = D.cameras.map(c => {
      const g = c.group || c.name, v = c.name.startsWith(g) ? c.name.slice(g.length).trim().replace(/^\((.*)\)$/, '$1') : '';
      return `<button type="button" data-cam="${esc(c.id)}" aria-pressed="${c.id === cam.id}">${esc(g)}${v ? `<small>${esc(v)}</small>` : ''}</button>`;
    }).join('');
    $('vers').innerHTML = D.versions.map(v => `<button type="button" data-ver="${esc(v.id)}" aria-pressed="${v.id === ver.id}"${TC.supports(cam, v) ? '' : ' disabled title="No config for this camera"'}>${esc(v.name)}<small>${esc(v.codename || '')} · ${esc(v.core || '')}</small></button>`).join('');
  }
  const go = (cid, vid) => { ({ cam, ver } = TC.pick(D, cid, vid)); TC.toHash(cam, ver); switches(); render(); };
  $('cams').onclick = ev => { const b = ev.target.closest('[data-cam]'); if (b) go(b.dataset.cam, ver.id); };
  $('vers').onclick = ev => { const b = ev.target.closest('[data-ver]'); if (b && !b.disabled) go(cam.id, b.dataset.ver); };

  // ---------- tabs ----------
  document.querySelector('.tabs').onclick = ev => {
    const b = ev.target.closest('[data-tab]'); if (!b) return;
    document.querySelectorAll('[data-tab]').forEach(x => x.setAttribute('aria-selected', x === b));
    document.querySelectorAll('[data-panel]').forEach(p => p.hidden = p.dataset.panel !== b.dataset.tab);
    if (b.dataset.tab === 'explore') edges();
  };

  // ---------- render all ----------
  function render() {
    V = TC.view(D, cam, ver);
    const P = V.page;
    document.title = P.title + ' · Explorer';
    $('title').textContent = P.title;
    $('eyebrow').textContent = P.eyebrow || '';
    $('camcard').innerHTML = `<h5>This camera</h5><dl>${(P.spec || []).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(TC.plain(v))}</dd>`).join('')}</dl>`;
    $('lede').innerHTML = md(P.lede);
    $('journey').innerHTML = V.journey.map(j => `<li><b>${md(j.title)}</b><p>${md(j.text)}</p></li>`).join('');
    $('callout').innerHTML = md(P.callout || '');
    $('boot').innerHTML = V.boot.map(b => `<li><span class="w">${esc(b.when || '')}</span><div class="t"><b>${md(b.title)}</b><p>${md(b.text)}</p></div></li>`).join('');
    $('boot-foot').innerHTML = md(P.boot_foot || '');
    $('repos-intro').innerHTML = md(P.repos_intro || '') + (ver.pins_source ? ' Pins: ' + md(ver.pins_source) + '.' : '');
    $('repos').innerHTML = V.repos.filter(r => r.table !== false).map(r => `<tr><td>${esc(r.piece)}</td><td><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a></td><td class="mono">${esc(r.pin || '–')}</td><td>${md(r.what)}</td></tr>`).join('');
    $('repos-foot').innerHTML = md(P.repos_foot || '');
    $('footer').textContent = `Layout C · Explorer · built ${D.meta.built} from architecture.toml · ${cam.name} + ${ver.name}: ${V.nodes.length} parts, ${V.edges.length} connections`;
    hist = hist.filter(id => V.byId[id]);
    if (!V.byId[sel]) sel = V.byId[P.default_selection] ? P.default_selection : V.nodes[0]?.id;
    list(); focus(sel, false);
  }

  // ---------- parts list + search ----------
  function list() {
    const q = query.trim().toLowerCase();
    const match = n => !q || [n.title, n.sub, n.about, n.id].some(s => TC.plain(s || '').toLowerCase().includes(q));
    const html = V.lanes.map(L => {
      const items = V.nodes.filter(n => n.lane === L.id && match(n));
      if (!items.length) return '';
      return `<div class="grp"><h5><span>${esc(L.label)}</span><span>${items.length}</span></h5>${items.map(n => {
        const k = n.kind || n.color;
        return `<button type="button" data-go="${esc(n.id)}" aria-current="${n.id === sel}"${k ? ` style="--k:var(--${esc(k)})"` : ''}><i></i><span>${esc(n.title)}</span><em>${V.ins(n.id).length}→${V.outs(n.id).length}</em></button>`;
      }).join('')}</div>`;
    }).join('');
    $('list').innerHTML = html || `<p class="none">No part matches “${esc(query)}”.</p>`;
  }
  $('q').addEventListener('input', ev => { query = ev.target.value; list(); });
  $('q').addEventListener('keydown', ev => {
    if (ev.key === 'Enter') { const b = $('list').querySelector('[data-go]'); if (b) focus(b.dataset.go); }
    if (ev.key === 'Escape') { ev.target.value = ''; query = ''; list(); }
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === '/' && document.activeElement !== $('q') && !ev.metaKey && !ev.ctrlKey) { ev.preventDefault(); $('q').focus(); }
  });

  // ---------- focus view ----------
  function focus(id, push = true) {
    if (!id || !V.byId[id]) return;
    if (push && sel && sel !== id) hist.push(sel);
    sel = id;
    const n = V.byId[id], L = V.laneById[n.lane];
    const near = new Set(V.edges.filter(e => e.from === id || e.to === id).flatMap(e => [e.from, e.to]));
    // stack minimap
    $('stack').innerHTML = V.lanes.map(l => `<div class="srow"><span>${esc(l.label)}</span><div>${V.nodes.filter(x => x.lane === l.id).map(x => `<button type="button" class="chip${x.id === id ? ' on' : near.has(x.id) ? ' near' : ''}" data-go="${esc(x.id)}">${esc(x.title.split(' · ')[0])}</button>`).join('')}</div></div>`).join('');
    // ego graph
    const card = (e, dir) => {
      const o = V.byId[dir === 'in' ? e.from : e.to], ol = V.laneById[o.lane];
      return `<button type="button" class="nb" data-go="${esc(o.id)}" data-edge="${dir}" style="--k:${K(e.kind)}"><small>${esc(ol.label)}</small><b>${esc(o.title)}</b><span><i class="${e.kind === 'control' ? 'dash' : ''}"></i>${esc(e.label)}</span></button>`;
    };
    const ins = V.ins(id), outs = V.outs(id);
    $('egoIn').innerHTML = `<h6>Gets from (${ins.length})</h6>` + (ins.map(e => card(e, 'in')).join('') || '<p class="empty">Nothing feeds into this part.</p>');
    $('egoOut').innerHTML = `<h6>Sends to (${outs.length})</h6>` + (outs.map(e => card(e, 'out')).join('') || '<p class="empty">This part sends nothing on.</p>');
    $('egoMid').innerHTML = `<small>${esc(L.tag || L.label)}</small><b>${esc(n.title)}</b>${n.sub ? `<span>${esc(n.sub)}</span>` : ''}`;
    $('egoIn')._edges = ins; $('egoOut')._edges = outs;
    // crumbs
    $('back').disabled = !hist.length;
    $('trail').innerHTML = hist.slice(-4).map(h => `<button type="button" data-go="${esc(h)}" data-crumb="1">${esc(V.byId[h].title)}</button> ›`).join(' ') + ` <b>${esc(n.title)}</b>`;
    // details
    const ups = n.upstream.map(u => V.repoById[u]).filter(Boolean).map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a> <span class="pin">${esc(r.pin || '')}</span></li>`).join('');
    $('info').innerHTML = `<div><span class="tag">${esc(L.tag || L.label)}</span><h3>${esc(n.title)}</h3>${n.sub ? `<p class="sub">${esc(n.sub)}</p>` : ''}</div>
      <div><h4>What it does</h4><p>${md(n.about)}</p>${n.note ? `<p class="sub" style="margin-top:6px">${md(n.note)}</p>` : ''}${n.file ? `<p class="sub" style="margin-top:6px"><code>${esc(n.file)}</code></p>` : ''}</div>
      <div><h4>How it starts</h4><p>${md(n.starts || '')}</p></div>
      ${ups ? `<div><h4>Upstream</h4><ul>${ups}</ul></div>` : ''}`;
    $('list').querySelectorAll('[data-go]').forEach(b => b.setAttribute('aria-current', b.dataset.go === id));
    requestAnimationFrame(edges);
  }
  function edges() {
    const svg = $('egosvg'), ego = $('ego'), mid = $('egoMid');
    if (!mid.offsetParent) return;
    const R = ego.getBoundingClientRect(), m = mid.getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${R.width} ${R.height}`);
    let out = '';
    for (const [colId, dir] of [['egoIn', 'in'], ['egoOut', 'out']]) {
      const list = $(colId)._edges || [];
      $(colId).querySelectorAll('.nb').forEach((b, i) => {
        const r = b.getBoundingClientRect(), e = list[i]; if (!e) return;
        const y1 = r.top + r.height / 2 - R.top, y2 = m.top + m.height / 2 - R.top + (i - (list.length - 1) / 2) * 6;
        const x1 = dir === 'in' ? r.right - R.left : m.right - R.left, x2 = dir === 'in' ? m.left - R.left : r.left - R.left;
        const ya = dir === 'in' ? y1 : y2, yb = dir === 'in' ? y2 : y1, dx = (x2 - x1) / 2;
        out += `<path class="edge ${e.kind}" style="stroke:${K(e.kind)}" d="M${x1},${ya} C${x1 + dx},${ya} ${x2 - dx},${yb} ${x2},${yb}"/>`;
      });
    }
    svg.innerHTML = out;
  }
  document.addEventListener('click', ev => {
    const b = ev.target.closest('[data-go]'); if (!b) return;
    if (b.dataset.crumb) { const i = hist.lastIndexOf(b.dataset.go); hist = hist.slice(0, i); focus(b.dataset.go, false); }
    else focus(b.dataset.go);
  });
  $('back').onclick = () => { const p = hist.pop(); if (p) focus(p, false); };
  new ResizeObserver(() => edges()).observe($('ego'));
  TC.onTheme(edges);
  window.addEventListener('hashchange', () => { const p = TC.fromHash(D); if (p.cam !== cam || p.ver !== ver) go(p.cam.id, p.ver.id); });

  switches(); render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(edges);
})();
</script>
</body>
</html>
