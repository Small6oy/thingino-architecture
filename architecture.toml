# Thingino architecture diagram: all the content lives here.
# Edit this file, then run:  python3 build.py        (full guide: architecture.md)
#
# ---- Writing text ----------------------------------------------------------------
# Text fields accept a little markup: `code`, **bold**, *italic*, [link text](https://...).
# Box titles and subtitles (title/sub) are drawn on the canvas, so keep them plain and short.
# Placeholders fill in from the selected camera and firmware version:
#   {camera.<field>}   any field of a [[cameras]] entry, e.g. {camera.sensor}
#   {version.<field>}  any field of a [[versions]] entry, e.g. {version.core}
# The build fails if a placeholder names a field that some camera or version doesn't have.
#
# ---- Showing things only for some cameras / versions -------------------------------
# Any lane, node, edge, journey step, boot step or repo can carry:
#   versions = ["thingino2"]         shown only for these firmware versions
#   cameras  = ["wyze-cam-v4"]       shown only for these cameras
#   needs    = ["nna"]               shown only if the camera has ALL these features
# Nothing set = shown everywhere. A hidden lane hides its boxes; a hidden box hides its lines.
#
# ---- Changing a field for one version or camera -------------------------------------
# Put a variant table right after the item:
#   [nodes.variant.thingino1]        (or [journey.variant.<id>], [page.variant.<id>] ...)
#   about = "text used when Thingino 1 is selected"
# Version variants apply first, then camera variants.

[page]
title   = "Thingino Camera Anatomy"
eyebrow = "{camera.name} · {version.name} {version.codename} · {version.core}"
lede    = "How light hitting the sensor becomes a video stream on your network. Pick a camera and a firmware version, then read the diagram top to bottom: hardware at the top, your network at the bottom. Click any box to see what it does, how it starts at boot, and which upstream repo it comes from."
callout = "**Settings travel the other way.** When you change a setting in the web UI, a CGI script calls `raptorctl`, which writes `/etc/raptor.conf` and sends the change to `rvd`'s control socket. `rvd` calls raptor-hal, raptor-hal calls libimp, and libimp sets the ISP or encoder register through the kernel."
boot_foot = "Raptor starts before the network on purpose: the rings fill straight away, and the servers wait for clients. Stopping runs the other way: consumers first, `rvd` last, then the rings are deleted."
repos_intro = "Thingino is a Buildroot tree. It doesn't contain most of this code; each package file names an upstream repo and pins a commit. Pins differ between firmware versions."
repos_foot = "Raptor splits the streamer into small daemons so that a crash in, say, WebRTC can't stop recording or RTSP. Only `rvd` and `rad` load the closed vendor library; nothing that faces the network shares memory with the hardware code."
# The facts row under the camera picker: [label, text]
spec = [
  ["SoC",      "{camera.soc} · {camera.cpu}"],
  ["Sensor",   "{camera.sensor} · {camera.resolution}"],
  ["Memory",   "{camera.ram}"],
  ["Flash",    "{camera.flash}"],
  ["Wi-Fi",    "{camera.wifi}"],
  ["Kernel",   "Linux {camera.kernel}"],
  ["Image",    "{camera.image}"],
]

[page.variant.thingino1]
callout = "**Settings travel the other way.** The web UI saves your change to prudynt's config (`/etc/prudynt.user.json`, on top of the defaults in `/etc/prudynt.json`) and has prudynt apply it. prudynt calls libimp itself, and libimp sets the ISP or encoder register through the kernel."
boot_foot = "Everything video-related starts in one step, `S31prudynt`. If prudynt stops, video, audio, RTSP and the preview all stop together."
repos_foot = "Thingino 1 uses one program, `prudynt`, for the whole streaming job. Thingino 2 replaced it with raptor, which splits the same work into small daemons so one crash can't take everything down."

# ---------------------------------------------------------------------------
