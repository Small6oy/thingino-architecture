tag = "Network"

[[lanes]]
id = "svc"
label = "System services"
sub = "BusyBox + friends"
cols = 6
height = 60
shape = "pill"
tag = "System service"

[[lanes]]
id = "out"
label = "Where it ends up"
sub = "your home"
cols = "auto"
min_cols = 5
tag = "Destination"

# ---------------------------------------------------------------------------
# Nodes: one [[nodes]] block per box, left to right within a lane.
#   id, lane, title, sub     required (sub is the small grey line)
#   col / span               optional: start column (0-based) and width in columns
#   kind                     colour: video | audio | control | detect
#   color                    border colour override: video | audio | control | detect | accent
#   about, starts            detail card text
#   upstream                 repo ids from [[repos]]
#   file                     path shown under "What it does"
#   standalone = true        no connections on purpose (skips the warning)
#   versions / cameras / needs / variant   see the top of this file
# ---------------------------------------------------------------------------

# --- hardware ---
[[nodes]]
id = "sensor"
lane = "hw"
title = "Image sensor"
sub = "{camera.sensor}"
about = "Turns light into numbers: {camera.resolution}. Each frame leaves the sensor as raw brightness values with no colour processing yet, and travels over a MIPI camera link into the SoC."
starts = "Powered up and programmed by its sensor kernel module when `S11modules` loads it."
upstream = ["ingenic-sdk"]

[[nodes]]
id = "soc"
lane = "hw"
title = "{camera.soc}"
sub = "{camera.cpu}"
about = "The main chip: a MIPS CPU plus fixed-function hardware for jobs a CPU is too slow for. That means the ISP (image processing), the video encoder ({camera.encoder}) and the IVS motion block. Programs never touch these blocks directly; they go through libimp and the kernel drivers. Memory: {camera.ram}."
starts = "Always on. U-Boot starts it from {camera.flash}."
upstream = []

[nodes.variant.wyze-cam-v4]
about = "The main chip: a MIPS CPU plus fixed-function hardware for jobs a CPU is too slow for. That means the ISP (image processing), the video encoder ({camera.encoder}), the IVS motion block and a neural-network accelerator (NNA). Programs never touch these blocks directly; they go through libimp and the kernel drivers. Memory: {camera.ram}."

[[nodes]]
id = "mic"
lane = "hw"
title = "Mic + speaker"
sub = "audio codec in the SoC"
about = "The microphone and speaker connect to an audio codec inside the SoC. Sound comes in as raw PCM samples and goes out the same way."
starts = "Driven by `audio.ko` after `S11modules`."
upstream = ["ingenic-sdk"]

[[nodes]]
id = "ircut"
lane = "hw"
title = "IR-cut + IR LEDs"
sub = "switched by GPIO"
about = "A small filter slides in front of the lens to block infrared by day (true colours) and out at night, when the infrared LEDs light the scene. Both are driven by GPIO pins, simple on/off lines on the SoC. The pin numbers are in `/etc/thingino.json`."
starts = "`S06ircut` sets a start position; `ric` takes over once raptor runs."
upstream = []

[nodes.variant.thingino1]
starts = "`S06ircut` sets a start position; `daynightd` takes over from `S10daynightd`."

[[nodes]]
id = "wifichip"
lane = "hw"
title = "Wi-Fi chip"
sub = "{camera.wifi_short}"
about = "{camera.wifi}. Every byte that leaves the camera goes through this radio. It is often the real bottleneck: check the actual link rate before tuning the encoder."
starts = "`S29wlanpower` powers it; its driver creates `wlan0`."
upstream = []

# --- kernel ---
[[nodes]]
id = "isp"
lane = "kern"
title = "tx-isp + sensor"
sub = "{camera.isp_module} + sensor .ko"
about = "`{camera.isp_module}` drives the ISP: demosaic (raw pixels to colour), exposure, white balance, noise reduction, flip and mirror. A separate sensor module holds the register settings for the {camera.sensor}."
starts = "Loaded by `/etc/init.d/S11modules`."
upstream = ["ingenic-sdk"]

[[nodes]]
id = "enc"
lane = "kern"
title = "Video encoder"
sub = "{camera.encoder}"
about = "Kernel driver that hands the SoC's hardware video and JPEG encoders to libimp."
starts = "Loaded by `S11modules`."
upstream = ["ingenic-sdk"]

[[nodes]]
id = "nna"
lane = "kern"
needs = ["nna"]
title = "soc-nna"
sub = "neural-net accelerator"
about = "Driver for the T41's neural-network accelerator, used for person and object detection."
starts = "Loaded by `S11modules` when detection is set up."
upstream = ["ingenic-sdk"]

[[nodes]]
id = "audiok"
lane = "kern"
title = "audio.ko"
sub = "audio codec driver"
about = "Kernel driver for the SoC's audio codec. libimp's audio API sits on top of it, which is what `rad` uses for microphone in and speaker out."
starts = "Loaded by `S11modules`."
upstream = ["ingenic-sdk"]

[nodes.variant.thingino1]
about = "Kernel driver for the SoC's audio codec. libimp's audio API sits on top of it, which is what prudynt uses for microphone in and speaker out."

[[nodes]]
id = "gpio"
lane = "kern"
title = "GPIO + PWM"
sub = "Linux gpio · ingenic-pwm"
about = "Standard Linux GPIO lines plus Ingenic's PWM driver for dimming. `ric` uses them for the IR-cut filter and IR LEDs; the LED, button and light scripts use them too."
starts = "Built into the kernel; `S05gpio` sets defaults."
upstream = ["kernel"]

[nodes.variant.thingino1]
about = "Standard Linux GPIO lines plus Ingenic's PWM driver for dimming. The `daynight` script (run by `daynightd`) uses them for the IR-cut filter and IR LEDs; the LED, button and light scripts use them too."

[[nodes]]
id = "wifidrv"
lane = "kern"
title = "Wi-Fi driver"
sub = "{camera.wifi_driver}"
about = "The chip maker's Wi-Fi driver ({camera.wifi_driver}), packaged in thingino as `package/wifi-*`. It creates the `wlan0` network interface."
starts = "Loaded by `S11modules` after `S29wlanpower`."
upstream = ["firmware"]

# --- SDK + HAL ---
[[nodes]]
id = "libimp"
lane = "sdk"
span = 2
title = "libimp"
sub = "Ingenic IMP SDK · closed source"
about = "Ingenic's own library and the only official way to drive the ISP, frame channels, encoders, IVS and audio. It is a closed binary, is not thread-safe, and its API changes between SoC generations. Exactly two raptor daemons load it: `rvd` and `rad`."
starts = "Loaded into `rvd` and `rad` when they start."
upstream = ["ingenic-lib"]

[nodes.variant.thingino1]
about = "Ingenic's own library and the only official way to drive the ISP, frame channels, encoders, IVS and audio. It is a closed binary, is not thread-safe, and its API changes between SoC generations. prudynt loads it directly, with no adapter layer in between."
starts = "Loaded into prudynt when it starts."

[[nodes]]
id = "hal"
lane = "sdk"
versions = ["thingino2"]
title = "raptor-hal"
sub = "one API for every SoC"
about = "Raptor's thin adapter over libimp. Each SoC generation (T10 to T41) has a slightly different libimp, and raptor-hal hides that so `rvd` and `rad` are written once."
starts = "Compiled into `rvd` and `rad`."
upstream = ["raptor-hal"]

# --- streamer core: Thingino 2 (raptor) ---
[[nodes]]
id = "rvd"
lane = "prod"
versions = ["thingino2"]
title = "rvd"
sub = "video daemon"
about = "The heart of raptor and the only daemon that owns the image pipeline. It sets up the sensor, ISP, frame channels (main at full resolution, sub small), hardware encoders, JPEG and IVS motion, then loops forever: take each encoded frame and publish it into a ring. It also blends `rod`'s OSD bitmaps into the picture and answers ISP and encoder commands on its control socket."
starts = "First daemon in `/etc/init.d/S31raptor`. The script waits up to 5 s for `/dev/shm/rss_ring_main` and gives up if it doesn't appear, because nothing else works without it."
upstream = ["raptor"]

[[nodes]]
id = "raptorctl"
lane = "prod"
versions = ["thingino2"]
title = "raptorctl"
sub = "command-line remote"
about = "The remote control for every daemon. It sends commands over the Unix sockets in `/var/run/rss/` (bitrate, OSD text, day/night and so on) and reads and writes `/etc/raptor.conf`. The web UI and helper scripts (daynight, ircut, color, privacy) all call it."
starts = "Not a daemon; it runs when something calls it."
upstream = ["raptor"]

[[nodes]]
id = "rad"
lane = "prod"
versions = ["thingino2"]
title = "rad"
sub = "audio daemon"
about = "Captures microphone PCM, encodes it (Opus, AAC, G.711 or L16) into the audio ring, and plays whatever is written to the speaker ring. Consumers that only speak one codec need the matching setting here."
starts = "Second in `S31raptor`, with `LD_PRELOAD=libimp-nodbg.so` when that file exists so it doesn't start a second libimp debug thread."
upstream = ["raptor"]

[[nodes]]
id = "rod"
lane = "prod"
versions = ["thingino2"]
title = "rod"
sub = "on-screen text"
about = "Draws the timestamp, uptime, custom text and logo as bitmaps (with the libschrift font renderer) into a shared-memory buffer. It never touches hardware: `rvd` copies the bitmaps into the hardware OSD regions, so the text is burned into every stream."
starts = "`S31raptor`, when `[osd]` is enabled (on by default)."
upstream = ["raptor"]

[[nodes]]
id = "ric"
lane = "prod"
versions = ["thingino2"]
title = "ric"
sub = "day / night"
about = "Decides day or night. It asks `rvd` for scene brightness and sensor gain, then switches the IR-cut filter and IR LEDs over GPIO and tells `rvd` to put the ISP in night (greyscale) mode. It uses different rules for each direction so it doesn't flip back and forth at dusk."
starts = "`S31raptor`, when `[ircut]` is enabled (on by default)."
upstream = ["raptor"]

# --- streamer core: Thingino 1 (prudynt) ---
[[nodes]]
id = "prudynt"
lane = "prod"
versions = ["thingino1"]
span = 3
title = "prudynt"
sub = "one program does the whole stream"
about = "Thingino 1's streamer. One program does what raptor splits across many daemons: it drives libimp directly (no raptor-hal), sets up the sensor and encoders, encodes video and audio, draws the timestamp, runs motion detection and serves RTSP itself. Builds with WebSockets also feed the web UI's live preview. It's simpler, but a crash or SDK hang stops everything at once."
starts = "`/etc/init.d/S31prudynt`. The script also moves old config files to the split layout: defaults in `/etc/prudynt.json`, your changes in `/etc/prudynt.user.json`."
upstream = ["prudynt"]

[[nodes]]
id = "daynightd"
lane = "prod"
versions = ["thingino1"]
title = "daynightd"
sub = "day / night"
about = "A small daemon that reads scene brightness from the ISP (`/proc/jz/isp/isp-m0`) and switches day and night through the `/sbin/daynight` script, which moves the IR-cut filter and switches the IR LEDs. Separate thresholds for each direction stop it flip-flopping at dusk."
starts = "`/etc/init.d/S10daynightd`."
upstream = ["daynightd"]

# --- rings (Thingino 2 only: the whole lane has versions = ["thingino2"]) ---
[[nodes]]
id = "main"
lane = "ring"
kind = "video"
title = "main"
sub = "H.264 / H.265"
about = "Encoded full-resolution video ({camera.resolution}) from the main channel."
file = "/dev/shm/rss_ring_main"

[[nodes]]
id = "sub"
lane = "ring"
kind = "video"
title = "sub"
sub = "small video"
about = "Encoded low-resolution video for previews and low-bandwidth clients."
file = "/dev/shm/rss_ring_sub"

[[nodes]]
id = "jpeg0"
lane = "ring"
kind = "video"
title = "jpeg0"
sub = "snapshots"
about = "JPEG snapshots from the main channel."
file = "/dev/shm/rss_ring_jpeg0"

[[nodes]]
id = "jpeg1"
lane = "ring"
kind = "video"
title = "jpeg1"
sub = "small snapshots"
about = "Small JPEG snapshots, for thumbnails and low-bandwidth previews."
file = "/dev/shm/rss_ring_jpeg1"

[[nodes]]
id = "ivs"
lane = "ring"
kind = "detect"
title = "ivs"
sub = "motion results"
about = "Not pictures: the motion grid from the SoC's IVS block, which `rvd` reads and passes on to `rmd`."
starts = "Produced by `rvd` when motion detection is in use."
upstream = ["raptor"]
note = ""

[nodes.variant.wyze-cam-v4]
about = "Not pictures: the motion grid from the SoC's IVS block (and NNA detections when enabled), which `rvd` reads and passes on to `rmd`."

[[nodes]]
id = "audio"
lane = "ring"
kind = "audio"
title = "audio"
sub = "mic, encoded"
about = "Encoded microphone audio from `rad`."
file = "/dev/shm/rss_ring_audio"

[[nodes]]
id = "speaker"
lane = "ring"
kind = "audio"
title = "speaker"
sub = "to the speaker"
about = "Audio going the other way. Clients (the RTSP backchannel, WebRTC, the `rac` tool) write here and `rad` plays it."
file = "/dev/shm/rss_ring_speaker"

[[nodes]]
id = "osd"
lane = "ring"
kind = "control"
title = "osd"
sub = "text bitmaps"
about = "A double buffer of BGRA bitmaps that `rod` draws and `rvd` reads. Two buffers means `rvd` never reads a half-drawn image."
starts = "Created by `rod` when it starts."
file = "/dev/shm/rss_osd_*"
note = ""

# --- consumers ---
[[nodes]]
id = "rsd"
lane = "cons"
versions = ["thingino2"]
title = "rsd"
sub = "RTSP server"
about = "The RTSP server, built on the compy library. It reads the main or sub ring plus audio and sends them as RTP over RTSP with Digest login. It can also take audio back from a client into the speaker ring."
starts = "`S31raptor`, `[rtsp]` enabled by default."
upstream = ["raptor", "compy"]

[[nodes]]
id = "rhd"
lane = "cons"
versions = ["thingino2"]
title = "rhd"
sub = "HTTP snap/MJPEG"
about = "A small HTTP server for `/snap` (JPEG), `/mjpeg` and `/audio`, read straight from the rings."
starts = "`S31raptor`, `[http]` enabled by default."
upstream = ["raptor"]

[[nodes]]
id = "rmd"
lane = "cons"
versions = ["thingino2"]
title = "rmd"
sub = "motion events"
about = "Turns IVS results into idle, active and cooldown states, filters by region and object type, and triggers `rmr` recording or GPIO outputs."
starts = "`S31raptor`, only if `[motion]` is enabled (off by default). Thingino adds `S32raptor-motion` for its motion helper scripts."
upstream = ["raptor"]

[[nodes]]
id = "rmr"
lane = "cons"
versions = ["thingino2"]
title = "rmr"
sub = "SD recording"
about = "Records crash-safe fragmented MP4 files to the microSD card, and timelapses. Recordings can be signed so tampering is detectable."
starts = "`S31raptor`, only if `[recording]` or `[timelapse]` is enabled (off by default)."
upstream = ["raptor"]

[[nodes]]
id = "rwd"
lane = "cons"
versions = ["thingino2"]
title = "rwd"
sub = "WebRTC"
about = "WebRTC live view for browsers and go2rtc, with under a second of delay and two-way audio (browser microphone to camera speaker)."
starts = "`S31raptor`, if installed and `[webrtc]` is enabled."
upstream = ["raptor"]

[[nodes]]
id = "onvif"
lane = "cons"
title = "onvif"
sub = "ONVIF"
about = "Lets NVRs and apps discover the camera and ask for its RTSP address and settings, using the ONVIF standard."
starts = "Served through the web server; `S96onvif_discovery` answers discovery probes on the LAN."
upstream = ["onvif"]

[[nodes]]
id = "webui"
lane = "cons"
title = "uhttpd"
sub = "web UI"
about = "OpenWrt's tiny web server, serving Thingino's web pages and CGI scripts: settings, live preview, firmware library. Settings changes go through `raptorctl` to the running daemons and into `/etc/raptor.conf`."
starts = "`/etc/init.d/S60uhttpd`."
upstream = ["uhttpd", "firmware"]

[nodes.variant.thingino1]
about = "OpenWrt's tiny web server, serving Thingino's web pages and CGI scripts: settings, live preview, firmware updates. Settings changes are saved to prudynt's config and applied by prudynt."

# --- network ---
[[nodes]]
id = "wlan"
lane = "net"
title = "wlan0 · Wi-Fi to your LAN"
sub = ""
about = "The network interface the Wi-Fi driver creates on the {camera.wifi_short}. Everything the camera sends leaves through here."
starts = "`S36wireless` and `S38wpa_supplicant` join the network; `S40network` gets an address by DHCP."
upstream = []

# --- system services ---
[[nodes]]
id = "mdnsd"
lane = "svc"
title = "mdnsd"
sub = "mDNS · S50"
about = "Announces the camera on the LAN (multicast DNS) so other devices can find it by name without a DNS server."
starts = "`/etc/init.d/S50mdnsd`."
upstream = ["mdnsd"]

[[nodes]]
id = "wpa"
lane = "svc"
title = "wpa_supplicant"
sub = "Wi-Fi login · S38"
about = "Joins your Wi-Fi network with the saved password and keeps the link up."
starts = "`/etc/init.d/S38wpa_supplicant`."
upstream = ["hostap"]

[[nodes]]
id = "dropbear"
lane = "svc"
standalone = true
title = "dropbear"
sub = "SSH · S50"
about = "The SSH server, for logging in to the camera's shell."
starts = "`/etc/init.d/S50dropbear`."
upstream = ["dropbear"]

[[nodes]]
id = "ntpd"
lane = "svc"
standalone = true
title = "ntpd"
sub = "time · S49"
about = "BusyBox ntpd sets the clock from the internet. These cameras have no real-time clock, and OSD timestamps and recordings need the right time."
starts = "`/etc/init.d/S49ntpd`."
upstream = ["busybox"]

[[nodes]]
id = "crond"
lane = "svc"
standalone = true
title = "crond"
sub = "timers · S50"
about = "Runs scheduled jobs, for example periodic checks and snapshots."
starts = "`/etc/init.d/S50crond`."
upstream = ["busybox"]

[[nodes]]
id = "syslogd"
lane = "svc"
standalone = true
title = "syslogd"
sub = "logs · S01"
about = "Collects every program's log messages. Read them on the camera with `logread`."
starts = "`/etc/init.d/S01syslogd`."
upstream = ["busybox"]

# --- destinations ---
[[nodes]]
id = "browser"
lane = "out"
title = "Web browser"
sub = "settings · preview"
about = "The camera's web UI, plus snapshots, MJPEG and WebRTC live view."
starts = "Not part of the camera."

[[nodes]]
id = "sd"
lane = "out"
needs = ["sd"]
versions = ["thingino2"]
title = "microSD card"
sub = "MP4 recordings"
about = "Where `rmr` writes recordings. U-Boot also reads recovery images (`autoupdate-full.bin`) from it."
starts = "Not part of the camera's software."

[[nodes]]
id = "nvr"
lane = "out"
title = "NVR / recorder"
sub = "Frigate · Blue Iris · ONVIF"
about = "Network video recorders pull the RTSP stream to record and analyse it. ONVIF lets them find the camera and its stream address on their own."
starts = "Not part of the camera."

[[nodes]]
id = "player"
lane = "out"
title = "Media player"
sub = "VLC · ffplay · go2rtc"
about = "Any RTSP client can play the stream directly, or a restreamer like go2rtc can share it onward."
starts = "Not part of the camera."

