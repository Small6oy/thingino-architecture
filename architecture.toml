# ---------------------------------------------------------------------------
# Lanes: the horizontal bands, top to bottom.
#   cols     = number of equal columns, or "auto" (= the boxes shown, at least min_cols)
#   shape    = box (default) | pill | band
#   height   = lane height in diagram units (default 76)
#   tag      = label shown above a box's name in the detail card
#   emphasis = true draws the lane's boxes in the accent colour
#   default_starts / default_upstream / note = used by every box in the lane unless it sets its own
# ---------------------------------------------------------------------------
[[lanes]]
id = "hw"
label = "Hardware"
sub = "on the board"
cols = "auto"
tag = "Hardware"

[[lanes]]
id = "kern"
label = "Linux kernel"
sub = "drivers (.ko)"
cols = "auto"
min_cols = 5
tag = "Kernel driver"

[[lanes]]
id = "sdk"
label = "Vendor SDK + HAL"
sub = "libraries"
cols = 5
height = 66
tag = "Library"

[[lanes]]
id = "prod"
label = "Streamer core"
sub = "{version.core} · {version.init}"
cols = "auto"
min_cols = 5
tag = "Streamer"
emphasis = true

[[lanes]]
id = "ring"
versions = ["thingino2"]
label = "Shared memory"
sub = "/dev/shm rings"
cols = 8
height = 56
shape = "pill"
tag = "Shared-memory ring"
default_starts = "Created by its producer (`rvd` or `rad`) at startup, and deleted by `S31raptor stop`."
default_upstream = ["raptor-ipc"]
note = "A ring buffer in RAM. One writer, any number of readers, each with its own read position. A slow reader only loses its own frames, and the writer never waits. Readers see the same memory the encoder wrote, so frames aren't copied."

[[lanes]]
id = "cons"
label = "Consumers"
sub = "read the stream"
cols = "auto"
min_cols = 5
tag = "Consumer"

[[lanes]]
