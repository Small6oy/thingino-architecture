# ---------------------------------------------------------------------------
# "A frame's journey" (numbered, in order)
# ---------------------------------------------------------------------------
[[journey]]
title = "Light hits the sensor."
text = "The {camera.sensor} reads out a raw grid of brightness values ({camera.resolution}), 20 to 30 times a second, and sends it over the MIPI link into the SoC."

[[journey]]
title = "The ISP makes it a picture."
text = "The ISP hardware block, driven by `{camera.isp_module}`, adds colour, sets exposure and white balance, removes noise and flips the image. `ric` watches its brightness readings to decide day or night."

[journey.variant.thingino1]
text = "The ISP hardware block, driven by `{camera.isp_module}`, adds colour, sets exposure and white balance, removes noise and flips the image. `daynightd` watches its brightness readings to decide day or night."

[[journey]]
title = "The picture is split into channels."
text = "A full-resolution *main* channel and a small *sub* channel. `rod`'s timestamp is burned in here by the hardware OSD."

[journey.variant.thingino1]
text = "A full-resolution *main* channel and a small *sub* channel. prudynt's timestamp is burned in here by the hardware OSD."

[[journey]]
title = "The hardware encoder compresses it."
text = "The {camera.encoder} encoder makes each frame tens to hundreds of times smaller. A JPEG encoder makes snapshots, and the IVS block computes a motion grid."

[[journey]]
versions = ["thingino2"]
title = "`rvd` publishes it."
text = "Through raptor-hal and libimp, `rvd` collects each encoded frame and writes it into a ring in `/dev/shm`. `rad` does the same for audio."

[[journey]]
versions = ["thingino2"]
title = "Consumers read the same frame."
text = "`rsd` wraps it in RTP for RTSP, `rwd` sends it over WebRTC, `rmr` writes MP4. None of them encode anything; they all read the same bytes."

[[journey]]
versions = ["thingino1"]
title = "prudynt collects it."
text = "prudynt pulls each encoded frame (and the audio) from libimp into its own memory. Nothing else on the camera sees the frames."

[[journey]]
versions = ["thingino1"]
title = "prudynt serves it."
text = "prudynt's own RTSP server sends the frame to every connected client, and the web UI preview gets a copy. It all happens inside one process."

[[journey]]
title = "Out over Wi-Fi."
text = "Packets leave through `wlan0` on the {camera.wifi_short}. An NVR or player pulls RTSP; a browser gets WebRTC or MJPEG."

[journey.variant.thingino1]
text = "Packets leave through `wlan0` on the {camera.wifi_short}. An NVR or player pulls RTSP from prudynt."

# ---------------------------------------------------------------------------
# "How it boots" (numbered, in order). `when` is the small grey tag.
# ---------------------------------------------------------------------------
[[boot]]
title = "U-Boot"
when = "bootloader"
text = "Reads its environment from the {camera.flash}, loads the kernel and starts it. It also flashes `autoupdate-full.bin` from a microSD card for recovery."

[[boot]]
title = "Linux kernel"
when = "Linux {camera.kernel}"
text = "Mounts the read-only root filesystem with a writable overlay on top, then starts BusyBox `init`."

[[boot]]
title = "Init scripts, in number order"
when = "/etc/init.d/S??*"
text = "Each `S` script runs in turn. The number sets the order; which scripts exist depends on the build."

[[boot]]
title = "Basics"
when = "S01–S07"
text = "syslog, entropy, timezone, hostname, GPIO defaults, IR-cut start position."

[[boot]]
versions = ["thingino1"]
title = "Day/night"
when = "S10daynightd"
text = "`daynightd` starts watching scene brightness."

[[boot]]
title = "Drivers"
when = "S11modules"
text = "Loads the ISP and sensor (`{camera.isp_module}`), encoder, audio and Wi-Fi ({camera.wifi_driver}) kernel modules."

[boot.variant.wyze-cam-v4]
text = "Loads the ISP and sensor (`{camera.isp_module}`), encoder, audio and Wi-Fi ({camera.wifi_driver}) kernel modules, plus `soc-nna` when detection is used."

[[boot]]
versions = ["thingino2"]
title = "Raptor"
when = "S31raptor"
text = "Starts `rvd` first and waits up to 5 s for `/dev/shm/rss_ring_main`. Then `rad`, `rod`, `rsd`, `rhd`, `ric`, and any optional daemon whose section is enabled in `raptor.conf` (`rmr`, `rmd`, `rwd`, `rsp`, `rsr`)."

[[boot]]
versions = ["thingino2"]
title = "Raptor helpers"
when = "S32–S33"
text = "`S32raptor-motion` and `S33raptor-privacy`."

[[boot]]
versions = ["thingino1"]
title = "Prudynt"
when = "S31prudynt"
text = "Starts prudynt, after moving any old-style config into `/etc/prudynt.user.json`. From here on, one process handles video, audio, OSD, motion and RTSP."

[[boot]]
title = "Settings restore + network"
when = "S36–S40"
text = "`S37cfg-autorestore` restores your backed-up config on the first boot after a flash. `S36wireless`, `S38wpa_supplicant` and `S40network` join Wi-Fi and get an address."

[[boot]]
title = "Services"
when = "S49–S60"
text = "`ntpd` sets the clock, then `dropbear` (SSH), `crond`, `mdnsd`, and `uhttpd` for the web UI."

[[boot]]
title = "Late extras"
when = "S96–S99"
text = "`S96onvif_discovery` and other optional services, then `S99led` to show the camera is ready."

[boot.variant.thingino1]
text = "`S96onvif_discovery`, the recording helpers, and `S99led` to show the camera is ready."

# ---------------------------------------------------------------------------
# Repos: the upstream table, and the ids that boxes use in `upstream = [...]`.
#   package = thingino-firmware package name; `build.py --pins` reads its pinned
#             commit from each version's `ref` (stored in pins.json)
#   pin     = text shown when there is no package (or before --pins has run)
#   table   = false keeps a repo out of the table (boxes can still link to it)
#   versions / cameras / needs work here too
# ---------------------------------------------------------------------------
