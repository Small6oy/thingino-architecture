#   group    = the model name; the picker groups configs under it
#   supports = version ids that ship a config for this camera (others are greyed out)
#   features = capabilities that `needs = [...]` checks (e.g. "nna", "ptz", "eth")
#   Every camera must have every field that a {camera.x} placeholder uses.
# Facts: Thingino board configs plus /proc on real hardware (2026-11-17).
# Other configs of the same models exist upstream (v3: T31AL/ATBM6031, RT5370;
# v4: GC4653 sensor) and can be added the same way.
# ---------------------------------------------------------------------------
