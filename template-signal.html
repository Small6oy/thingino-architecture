<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__ · Signal Path</title>
<!-- Layout B "Signal Path". Generated by build.py from architecture.toml; edit the data or this template. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: the stack runs left to right as a signal chain in a horizontal scroller; a sticky drawer on the right holds the detail. Blueprint look: square cards, ports, grid paper. */
:root {
  --paper: #edf1f6; --sheet: #f8fafc; --grid: #dbe3ee; --ink: #0f1b33; --muted: #56627a; --rule: #b9c5d6;
  --video: #1f5fd6; --audio: #c26a00; --control: #6b778c; --detect: #b02a8f; --hot: #ff6a13;
  --f-display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0a1324; --sheet: #0f1a30; --grid: #16243f; --ink: #dce6f7; --muted: #8796b3; --rule: #2a3b5e;
    --video: #5b9bff; --audio: #ffae45; --control: #8e9bb4; --detect: #f06cc9; --hot: #ff8a3d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0a1324; --sheet: #0f1a30; --grid: #16243f; --ink: #dce6f7; --muted: #8796b3; --rule: #2a3b5e;
  --video: #5b9bff; --audio: #ffae45; --control: #8e9bb4; --detect: #f06cc9; --hot: #ff8a3d; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 80px; }
body {
  margin: 0; color: var(--ink); font-family: var(--f-display); font-stretch: 100%; font-size: 15px; line-height: 1.55;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
code { font-family: var(--f-mono); font-size: 0.86em; }
a { color: var(--video); }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
.mono { font-family: var(--f-mono); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--sheet); border-bottom: 1px solid var(--rule);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; justify-content: space-between; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--sheet); }
.brand { display: flex; gap: 10px; align-items: center; font-weight: 700; font-stretch: 75%; font-size: 18px; letter-spacing: 0.01em; text-transform: uppercase; }
.brand i { width: 14px; height: 14px; border: 2px solid var(--hot); border-radius: 50%; position: relative; }
.brand i::after { content: ""; position: absolute; inset: 3px; background: var(--hot); border-radius: 50%; }
.pick { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.pick label { display: flex; gap: 8px; align-items: center; font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.pick select { font-family: var(--f-mono); font-size: 13px; text-transform: none; letter-spacing: 0; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); padding: 6px 8px; max-width: 62vw; }

.wrap { max-width: 1480px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 44px; }
.wrap > *, .stage > *, .stage-grid > * { min-width: 0; }
.intro { display: grid; gap: 10px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--hot); margin: 0; }
h2 { margin: 0; font-size: 26px; font-weight: 750; font-stretch: 75%; text-transform: uppercase; letter-spacing: 0.01em; }
h3 { margin: 0; font-size: 24px; font-weight: 700; font-stretch: 87%; }
.spec { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 0; padding: 0; list-style: none; }
.spec li { font-family: var(--f-mono); font-size: 12px; border: 1px solid var(--rule); background: var(--sheet); padding: 4px 8px; }
.spec li b { color: var(--muted); font-weight: 500; margin-right: 6px; text-transform: uppercase; font-size: 10px; letter-spacing: 0.08em; }

/* stage */
.stage { display: grid; gap: 12px; }
.tools { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--rule); background: var(--sheet); }
.seg button { border: 0; background: none; padding: 6px 12px; font-family: var(--f-mono); font-size: 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.sw { width: 14px; border-top: 2px solid; display: inline-block; }
.sw.dash { border-top-style: dashed; }
/* Lanes run top to bottom (like the canvas layout). Wires (SVG) sit above lane stripes but below cards.
   When the drawer is open on a wide screen the cards narrow to leave room for it. */
.stage-grid { position: relative; }
.scroller { overflow-x: auto; border: 1px solid var(--rule); background: var(--sheet); }
.track { position: relative; min-width: 900px; transition: padding-right .2s ease; }
@media (min-width: 1100px) { .track.drawer-open { padding-right: 384px; } }
#wires { position: absolute; left: 0; top: 0; z-index: 1; pointer-events: none; overflow: visible; }
.row { display: grid; grid-template-columns: 136px minmax(0, 1fr); gap: 16px; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--grid); }
.row:nth-child(odd of .row) { background: color-mix(in srgb, var(--grid) 35%, transparent); }
.row:last-child { border-bottom: 0; }
.row-h { display: grid; gap: 1px; align-content: center; }
.row-h .n { font-family: var(--f-mono); font-size: 10.5px; color: var(--hot); }
.row-h b { font-weight: 700; font-stretch: 75%; font-size: 15px; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.15; }
.row-h span { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 16px 18px; }
.card { position: relative; z-index: 2; text-align: left; border: 1px solid var(--rule); background: var(--paper); padding: 9px 12px; min-height: 54px; cursor: pointer; display: grid; gap: 1px; align-content: center; transition: opacity .2s, border-color .2s; min-width: 0; }
.card::before, .card::after { content: ""; position: absolute; left: 50%; width: 7px; height: 7px; margin-left: -4px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 50%; }
.card::before { top: -4px; } .card::after { bottom: -4px; }
.card b { font-family: var(--f-mono); font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card span { font-size: 12px; color: var(--muted); line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow-wrap: anywhere; }
.card.pill { border-radius: 999px; text-align: center; padding: 7px 14px; min-height: 44px; }
.card.band { text-align: center; border-style: dashed; background: transparent; min-height: 36px; }
.card[data-kind] b::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; background: var(--k); vertical-align: 1px; }
.card.core { border-color: var(--ink); }
.card.dim { opacity: 0.28; }
.card.lit { border-color: var(--ink); }
.card.sel { border-color: var(--hot); box-shadow: 0 0 0 1px var(--hot); }
.card:hover { border-color: var(--ink); }
.wire { fill: none; stroke-width: 1.4; transition: opacity .2s; }
.wire.control { stroke-dasharray: 4 4; }
.wire.dim { opacity: 0.08; }
.wire.lit { stroke-width: 2.2; }
@media (prefers-reduced-motion: no-preference) {
  .wire.lit.flow { stroke-dasharray: 6 6; animation: run 0.9s linear infinite; }
  @keyframes run { to { stroke-dashoffset: -12; } }
}

.rail { position: absolute; z-index: 5; top: 0; right: 0; bottom: 0; width: 384px; pointer-events: none; }
.drawer { position: sticky; top: 72px; margin: 12px; max-height: calc(100vh - 92px); pointer-events: auto;
  border: 1px solid var(--ink); background: var(--sheet); padding: 18px; display: grid; gap: 14px; align-content: start; overflow: auto;
  box-shadow: -18px 0 36px -18px rgba(5, 12, 28, 0.45); }
@media (prefers-reduced-motion: no-preference) { .rail:not([hidden]) .drawer { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateX(16px); opacity: 0; } } }
@media (max-width: 1099px) { .rail { position: static; width: auto; } .drawer { position: static; margin: 12px 0 0; max-height: none; box-shadow: none; } }
.rail[hidden] { display: none; }
.drawer .close { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border: 1px solid var(--rule); background: var(--paper); cursor: pointer; font-family: var(--f-mono); font-size: 14px; line-height: 1; }
.drawer .close:hover { border-color: var(--ink); }
.drawer .tag { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--hot); }
.drawer h4 { margin: 0 0 4px; font-family: var(--f-mono); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.drawer p { margin: 0; font-size: 14px; }
.drawer ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.drawer .sub { color: var(--muted); font-size: 13px; }
.link { border: 0; background: none; padding: 1px 0; cursor: pointer; text-align: left; font-size: 13px; display: flex; gap: 8px; align-items: baseline; }
.link i { width: 10px; border-top: 2px solid var(--k); display: inline-block; flex: none; transform: translateY(-3px); }
.link:hover b { text-decoration: underline; }
.pin { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }

/* journey */
.journey { list-style: none; margin: 0; padding: 0 0 8px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 0; overflow-x: auto; counter-reset: j; scroll-snap-type: x mandatory; }
.journey li { counter-increment: j; scroll-snap-align: start; padding: 0 18px 0 0; display: grid; gap: 8px; align-content: start; }
.journey li::before { content: counter(j, decimal-leading-zero); font-family: var(--f-mono); font-size: 12px; color: var(--hot); border-bottom: 1px solid var(--ink); padding-bottom: 6px; }
.journey b { font-weight: 700; font-stretch: 87%; font-size: 16px; line-height: 1.25; }
.journey p { margin: 0; font-size: 14px; color: var(--muted); }
.callout { margin: 0; font-size: 15px; border: 1px dashed var(--rule); background: var(--sheet); padding: 14px 16px; max-width: 80ch; }

/* boot ruler */
.ruler-wrap { overflow-x: auto; border: 1px solid var(--rule); background: var(--sheet); }
.ruler { position: relative; min-width: 900px; height: 132px; margin: 0 24px; }
.ruler .axis { position: absolute; left: 0; right: 0; top: 84px; border-top: 1px solid var(--ink); }
.ruler .tick { position: absolute; top: 84px; height: 8px; border-left: 1px solid var(--ink); font-family: var(--f-mono); font-size: 10px; color: var(--muted); }
.ruler .tick span { position: absolute; top: 10px; transform: translateX(-50%); }
.ruler .zone { position: absolute; top: 60px; font-family: var(--f-mono); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.mark { position: absolute; border: 1px solid var(--ink); background: var(--paper); font-family: var(--f-mono); font-size: 11px; padding: 2px 6px; cursor: pointer; white-space: nowrap; transform: translateX(-50%); }
.mark.range { transform: none; text-align: center; overflow: hidden; text-overflow: ellipsis; }
.mark.sel { background: var(--hot); color: #fff; border-color: var(--hot); }
.mark::after { content: ""; position: absolute; left: 50%; top: 100%; height: var(--stem, 10px); border-left: 1px dotted var(--ink); }
.boot-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.boot-list li { border: 1px solid var(--rule); background: var(--sheet); padding: 12px 14px; display: grid; gap: 4px; align-content: start; transition: border-color .2s; }
.boot-list li.sel { border-color: var(--hot); }
.boot-list .w { font-family: var(--f-mono); font-size: 11px; color: var(--hot); }
.boot-list b { font-stretch: 87%; }
.boot-list p { margin: 0; font-size: 13px; color: var(--muted); }

/* sources */
.repos { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.repo { border: 1px solid var(--rule); background: var(--sheet); padding: 12px 14px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.repo .p { font-family: var(--f-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.repo .p span:last-child { color: var(--ink); background: var(--grid); padding: 0 5px; text-transform: none; letter-spacing: 0; font-size: 11px; }
.repo a { font-family: var(--f-mono); font-size: 13px; overflow-wrap: anywhere; }
.repo p { margin: 0; font-size: 13px; color: var(--muted); }
.foot { margin: 0; font-size: 13px; color: var(--muted); max-width: 80ch; }
section > .head { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; margin-bottom: 14px; }
section > .head p { margin: 0; color: var(--muted); font-size: 14px; }
footer { font-family: var(--f-mono); font-size: 11px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 14px; }
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><i></i><span id="brand"></span></div>
  <div class="pick">
    <label for="cam">Camera <select id="cam"></select></label>
    <label for="ver">Firmware <select id="ver"></select></label>
  </div>
</header>

<main class="wrap">
  <section class="intro">
    <p class="eyebrow" id="eyebrow"></p>
    <ul class="spec" id="spec"></ul>
  </section>

  <section class="stage" aria-label="Signal path">
    <div class="tools">
      <div class="seg" role="group" aria-label="Flows">
        <button type="button" data-f="all" aria-pressed="true">all</button>
        <button type="button" data-f="video" aria-pressed="false"><i class="sw" style="color:var(--video)"></i>video</button>
        <button type="button" data-f="audio" aria-pressed="false"><i class="sw" style="color:var(--audio)"></i>audio</button>
        <button type="button" data-f="control" aria-pressed="false"><i class="sw dash" style="color:var(--control)"></i>control</button>
        <button type="button" data-f="detect" aria-pressed="false"><i class="sw" style="color:var(--detect)"></i>motion</button>
      </div>
      <div class="seg" role="group" aria-label="Highlight">
        <button type="button" data-m="near" aria-pressed="true">neighbours</button>
        <button type="button" data-m="path" aria-pressed="false">whole path</button>
      </div>
    </div>
    <div class="stage-grid">
      <div class="scroller" id="scroller"><div class="track" id="track"><svg id="wires" aria-hidden="true"></svg></div></div>
      <div class="rail" id="rail" hidden><aside class="drawer" id="drawer" aria-live="polite"></aside></div>
    </div>
  </section>

  <section>
    <div class="head"><h2>A frame's journey</h2><p>Scroll sideways through the steps.</p></div>
    <ol class="journey" id="journey"></ol>
    <p class="callout" id="callout" style="margin-top:16px"></p>
  </section>

  <section>
    <div class="head"><h2>Boot, on the init ruler</h2><p>Init scripts run in number order, S00 to S99.</p></div>
    <div class="ruler-wrap"><div class="ruler" id="ruler"></div></div>
    <ol class="boot-list" id="boot" style="margin-top:12px"></ol>
    <p class="foot" id="boot-foot" style="margin-top:12px"></p>
  </section>

  <section>
    <div class="head"><h2>Upstream</h2><p id="repos-intro"></p></div>
    <div class="repos" id="repos"></div>
    <p class="foot" id="repos-foot" style="margin-top:12px"></p>
  </section>

  <footer id="footer"></footer>
</main>

<script>/*__CORE__*/</script>
<script>
const DATA = /*__DATA__*/null;
(() => {
  const D = DATA, { esc, md } = TC, $ = id => document.getElementById(id);
  let V, sel = null, filter = 'all', mode = 'near';
  let { cam, ver } = TC.fromHash(D);

  // ---------- pickers ----------
  const camSel = $('cam'), verSel = $('ver');
  const groups = [...new Set(D.cameras.map(c => c.group || c.name))];
  camSel.innerHTML = groups.map(g => `<optgroup label="${esc(g)}">${D.cameras.filter(c => (c.group || c.name) === g).map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</optgroup>`).join('');
  const syncPickers = () => {
    verSel.innerHTML = D.versions.map(v => `<option value="${esc(v.id)}"${TC.supports(cam, v) ? '' : ' disabled'}>${esc(v.name)} ${esc(v.codename || '')} · ${esc(v.core || '')}</option>`).join('');
    camSel.value = cam.id; verSel.value = ver.id;
  };
  const go = (cid, vid) => { ({ cam, ver } = TC.pick(D, cid, vid)); TC.toHash(cam, ver); syncPickers(); render(); };
  camSel.onchange = () => go(camSel.value, ver.id);
  verSel.onchange = () => go(cam.id, verSel.value);

  // ---------- render ----------
  function render() {
    V = TC.view(D, cam, ver);
    const P = V.page;
    document.title = P.title + ' · Signal Path';
    $('brand').textContent = P.title;
    $('eyebrow').textContent = P.eyebrow || '';
    $('spec').innerHTML = TC.specRows(P).map(([k, v]) => `<li><b>${esc(k)}</b>${esc(TC.plain(v))}</li>`).join('');

    // lanes, top to bottom
    const track = $('track');
    track.querySelectorAll('.row').forEach(r => r.remove());
    V.lanes.forEach((L, i) => {
      const lane = V.nodes.filter(n => n.lane === L.id);
      let nxt = 0, end = 0;
      lane.forEach(n => { n._col = n.col ?? nxt; n._span = n.span || 1; nxt = n._col + n._span; end = Math.max(end, nxt); });
      const cols = L.cols === 'auto' ? Math.max(end, L.min_cols || 1) : L.cols;
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<div class="row-h"><span class="n">${String(i + 1).padStart(2, '0')} / ${String(V.lanes.length).padStart(2, '0')}</span><b>${esc(L.label)}</b><span>${esc(L.sub || '')}</span></div>` +
        `<div class="cards" style="--cols:${cols}">` + lane.map(n => {
          const k = n.kind || n.color;
          const cls = ['card', L.emphasis ? 'core' : '', L.shape === 'pill' ? 'pill' : '', L.shape === 'band' ? 'band' : ''].filter(Boolean).join(' ');
          return `<button type="button" class="${cls}" data-id="${esc(n.id)}" title="${esc(n.title)}${n.sub ? ' · ' + esc(n.sub) : ''}" style="grid-column:${n._col + 1} / span ${n._span}${k ? `;--k:var(--${esc(k)})` : ''}"${k ? ` data-kind="${esc(k)}"` : ''}><b>${esc(n.title)}</b>${n.sub ? `<span>${esc(n.sub)}</span>` : ''}</button>`;
        }).join('') + '</div>';
      track.appendChild(row);
    });

    $('journey').innerHTML = V.journey.map(j => `<li><b>${md(j.title)}</b><p>${md(j.text)}</p></li>`).join('');
    $('callout').innerHTML = md(P.callout || '');
    renderBoot(P);
    $('repos-intro').innerHTML = md(P.repos_intro || '') + (ver.pins_source ? ' Pins: ' + md(ver.pins_source) + '.' : '');
    $('repos').innerHTML = V.repos.filter(r => r.table !== false).map(r => `<div class="repo"><div class="p"><span>${esc(r.piece)}</span><span>${esc(r.pin || '–')}</span></div><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a><p>${md(r.what)}</p></div>`).join('');
    $('repos-foot').innerHTML = md(P.repos_foot || '');
    $('footer').textContent = `Layout B · Signal Path · built ${D.meta.built} from architecture.toml · ${cam.name} + ${ver.name}: ${V.nodes.length} parts, ${V.edges.length} connections`;

    if (!V.byId[sel]) sel = V.byId[P.default_selection] ? P.default_selection : null;
    select(sel);
  }

  // ---------- boot ruler ----------
  function renderBoot(P) {
    const ruler = $('ruler'), PRE = 14; // percent of width for the pre-init zone
    const pos = n => PRE + (n / 99) * (100 - PRE);
    let html = `<div class="axis"></div><div class="zone" style="left:0">power-on</div><div class="zone" style="left:${PRE}%">/etc/init.d</div>`;
    for (let t = 0; t <= 90; t += 10) html += `<div class="tick" style="left:${pos(t)}%"><span>S${String(t).padStart(2, '0')}</span></div>`;
    html += `<div class="tick" style="left:${pos(99)}%"><span>S99</span></div>`;
    let pre = 0, lane = 0;
    V.boot.forEach((b, i) => {
      const nums = [...String(b.when || '').matchAll(/S(\d{2})/g)].map(m => +m[1]);
      const top = 8 + (lane++ % 3) * 22, stem = 84 - top - 20;
      if (!nums.length) {
        const left = 2 + (pre++) * (PRE - 4) / 2.2;
        html += `<button type="button" class="mark" data-b="${i}" style="left:${left + 4}%;top:${top}px;--stem:${stem}px">${esc(b.title.split(',')[0])}</button>`;
      } else if (nums.length > 1 && nums[1] > nums[0]) {
        const l = pos(nums[0]), w = pos(nums[1]) - l;
        html += `<button type="button" class="mark range" data-b="${i}" style="left:${l}%;width:${Math.max(w, 3)}%;top:${top}px;--stem:${stem}px">${esc(b.when)}</button>`;
      } else {
        html += `<button type="button" class="mark" data-b="${i}" style="left:${pos(nums[0])}%;top:${top}px;--stem:${stem}px">${esc(b.when)}</button>`;
      }
    });
    ruler.innerHTML = html;
    $('boot').innerHTML = V.boot.map((b, i) => `<li data-b="${i}"><span class="w">${esc(b.when || '')}</span><b>${md(b.title)}</b><p>${md(b.text)}</p></li>`).join('');
    $('boot-foot').innerHTML = md(P.boot_foot || '');
  }
  $('ruler').addEventListener('click', ev => {
    const m = ev.target.closest('[data-b]'); if (!m) return;
    const i = m.dataset.b;
    document.querySelectorAll('[data-b]').forEach(x => x.classList.toggle('sel', x.dataset.b === i));
    document.querySelector(`#boot li[data-b="${i}"]`)?.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  });

  // ---------- wires ----------
  function wires() {
    const svg = $('wires'), track = $('track');
    const tr = track.getBoundingClientRect();
    svg.setAttribute('width', track.scrollWidth); svg.setAttribute('height', track.scrollHeight);
    svg.setAttribute('viewBox', `0 0 ${track.scrollWidth} ${track.scrollHeight}`);
    const box = {};
    track.querySelectorAll('.card').forEach(c => { const r = c.getBoundingClientRect(); box[c.dataset.id] = { x: r.left - tr.left, y: r.top - tr.top, w: r.width, h: r.height }; });
    const lit = litSet();
    const color = k => `var(--${k === 'mixed' ? 'ink' : k})`;
    let out = '';
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    V.edges.forEach(e => {
      const a = box[e.from], b = box[e.to]; if (!a || !b) return;
      const la = V.laneIndex[V.byId[e.from].lane], lb = V.laneIndex[V.byId[e.to].lane];
      const acx = a.x + a.w / 2, bcx = b.x + b.w / 2;
      let d;
      if (la === lb) {
        // same lane: arc over (or under) the row
        const up = e.arc !== 'down', ya = up ? a.y : a.y + a.h, yb = up ? b.y : b.y + b.h;
        const lift = Math.min(60, 16 + Math.abs(acx - bcx) * 0.08) * (up ? -1 : 1);
        const xa = acx + (bcx > acx ? a.w * 0.3 : -a.w * 0.3), xb = bcx + (acx > bcx ? b.w * 0.3 : -b.w * 0.3);
        d = `M${xa},${ya} C${xa},${ya + lift} ${xb},${yb + lift} ${xb},${yb}`;
      } else {
        // between lanes: bottom port to top port going down, top to bottom going up; spread ports by direction
        const down = lb > la;
        const xa = acx + clamp((bcx - acx) * 0.22, -a.w * 0.38, a.w * 0.38), xb = bcx + clamp((acx - bcx) * 0.22, -b.w * 0.38, b.w * 0.38);
        const ya = down ? a.y + a.h : a.y, yb = down ? b.y : b.y + b.h, dy = (yb - ya) / 2;
        d = `M${xa},${ya} C${xa},${ya + dy} ${xb},${yb - dy} ${xb},${yb}`;
      }
      const on = filter === 'all' || e.kind === filter || e.kind === 'mixed';
      const hl = sel && lit.has(e.from) && lit.has(e.to) && (mode === 'path' || e.from === sel || e.to === sel);
      const cls = ['wire', e.kind, !on || (sel && !hl) ? 'dim' : '', hl ? 'lit' : '', hl && e.kind !== 'control' ? 'flow' : ''].join(' ');
      out += `<path class="${cls}" d="${d}" style="stroke:${color(e.kind)}" marker-end="url(#ar-${e.kind})"/>`;
    });
    const marks = ['video', 'audio', 'control', 'detect', 'mixed'].map(k => `<marker id="ar-${k}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" style="fill:${color(k)}"/></marker>`).join('');
    svg.innerHTML = `<defs>${marks}</defs>${out}`;
  }
  const litSet = () => !sel ? new Set() : mode === 'path' ? TC.trace(V, sel)
    : new Set([sel, ...V.edges.filter(e => e.from === sel || e.to === sel).flatMap(e => [e.from, e.to])]);

  // ---------- selection + drawer ----------
  function select(id) {
    sel = id;
    const lit = litSet();
    document.querySelectorAll('.card').forEach(c => {
      c.classList.toggle('sel', c.dataset.id === sel);
      c.classList.toggle('lit', !!sel && lit.has(c.dataset.id) && c.dataset.id !== sel);
      c.classList.toggle('dim', !!sel && !lit.has(c.dataset.id));
    });
    wires(); drawer();
  }
  function drawer() {
    const el = $('drawer');
    $('rail').hidden = !sel;
    $('track').classList.toggle('drawer-open', !!sel);
    if (!sel) { el.innerHTML = ''; return; }
    const n = V.byId[sel], L = V.laneById[n.lane];
    const link = (e, dir) => { const o = V.byId[dir === 'in' ? e.from : e.to]; return `<li><button type="button" class="link" data-go="${esc(o.id)}" style="--k:var(--${e.kind === 'mixed' ? 'ink' : e.kind})"><i></i><span>${dir === 'in' ? 'from' : 'to'} <b>${esc(o.title)}</b> · ${esc(e.label)}</span></button></li>`; };
    const ups = n.upstream.map(id => V.repoById[id]).filter(Boolean).map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a> <span class="pin">${esc(r.pin || '')}</span></li>`).join('');
    const path = mode === 'path' ? `<p class="sub">Whole path: ${litSet().size - 1} parts carry this signal (control lines not followed).</p>` : '';
    el.innerHTML = `<button type="button" class="close" data-close aria-label="Close details">×</button><span class="tag">${esc(L.tag || L.label)}</span><div><h3>${esc(n.title)}</h3>${n.sub ? `<p class="sub">${esc(n.sub)}</p>` : ''}</div>${path}
      <div><h4>What it does</h4><p>${md(n.about)}</p>${n.note ? `<p class="sub" style="margin-top:6px">${md(n.note)}</p>` : ''}${n.file ? `<p class="sub" style="margin-top:6px"><code>${esc(n.file)}</code></p>` : ''}</div>
      <div><h4>How it starts</h4><p>${md(n.starts || '')}</p></div>
      ${ups ? `<div><h4>Upstream</h4><ul>${ups}</ul></div>` : ''}
      <div><h4>Connections</h4><ul>${[...V.ins(sel).map(e => link(e, 'in')), ...V.outs(sel).map(e => link(e, 'out'))].join('') || '<li class="sub">None drawn</li>'}</ul></div>`;
  }
  $('track').addEventListener('click', ev => { const c = ev.target.closest('.card'); select(c ? (c.dataset.id === sel ? null : c.dataset.id) : null); });
  $('drawer').addEventListener('click', ev => {
    if (ev.target.closest('[data-close]')) { select(null); return; }
    const b = ev.target.closest('[data-go]'); if (b) { select(b.dataset.go); reveal(b.dataset.go); }
  });
  // Bring a card into view (vertically) after jumping to it from the drawer
  function reveal(id) {
    const smooth = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
    document.querySelector(`.card[data-id="${id}"]`)?.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: smooth });
  }
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && sel) select(null); });
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; document.querySelectorAll('[data-f]').forEach(x => x.setAttribute('aria-pressed', x === b)); wires(); });
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mode = b.dataset.m; document.querySelectorAll('[data-m]').forEach(x => x.setAttribute('aria-pressed', x === b)); select(sel); });
  new ResizeObserver(() => wires()).observe($('track'));
  TC.onTheme(() => wires());
  window.addEventListener('hashchange', () => { const p = TC.fromHash(D); if (p.cam !== cam || p.ver !== ver) go(p.cam.id, p.ver.id); });

  syncPickers(); render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(wires);
})();
</script>
</body>
</html>
