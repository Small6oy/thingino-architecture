<style>
/* Layout: one long reading column; the canvas diagram runs full width, with a detail card under it. */
:root {
  --bg: #f1f4f3; --surface: #ffffff; --lane: #e6ecea; --ink: #16201d; --muted: #5a6762; --line: #cfd9d5;
  --video: #0d8573; --audio: #b8700c; --control: #66707e; --detect: #7449c9; --accent: #0d8573;
  --f-display: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1211; --surface: #151c1a; --lane: #111816; --ink: #e4ebe8; --muted: #91a09a; --line: #29342f;
    --video: #3ac4ad; --audio: #f0a63a; --control: #8d97a6; --detect: #a98bf2; --accent: #3ac4ad; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1211; --surface: #151c1a; --lane: #111816; --ink: #e4ebe8; --muted: #91a09a; --line: #29342f;
  --video: #3ac4ad; --audio: #f0a63a; --control: #8d97a6; --detect: #a98bf2; --accent: #3ac4ad; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 24px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 48px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(30px, 4.6vw, 46px); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 24px; font-weight: 600; }
h3 { font-size: 21px; font-weight: 600; }
h4 { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 6px; font-weight: 500; }
p { margin: 0; }
.prose { max-width: 68ch; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
code { font-family: var(--f-mono); font-size: 0.88em; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.diagram { display: grid; gap: 14px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; justify-content: space-between; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { font: 500 13px var(--f-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.filters button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.sw { width: 18px; height: 0; border-top: 3px solid; display: inline-block; }
.sw.dash { border-top-style: dashed; }
.hint { font-size: 13px; color: var(--muted); }
.canvas-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
canvas { display: block; }
.detail { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px; display: grid; gap: 18px; }
.d-head { display: grid; gap: 4px; }
.d-head .tag { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.d-sub { color: var(--muted); }
.d-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px 28px; }
.d-grid > div { min-width: 0; display: grid; gap: 8px; align-content: start; }
.d-grid ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.conn { font: 13px var(--f-body); background: none; border: 0; padding: 2px 0; color: var(--ink); cursor: pointer; text-align: left; display: flex; gap: 8px; align-items: baseline; }
.conn:hover b { text-decoration: underline; }
.conn .dir { font-family: var(--f-mono); color: var(--muted); width: 1.4em; flex: none; }
.conn .k { width: 8px; height: 8px; border-radius: 50%; flex: none; transform: translateY(-1px); }
.pin { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 48px; align-items: start; }
.cols > section, .stack { min-width: 0; display: grid; gap: 16px; }
ol.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; display: grid; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
ol.steps li::before { content: counter(s); font-family: var(--f-mono); font-size: 12px; color: var(--accent); border: 1px solid var(--accent); border-radius: 50%; width: 26px; height: 26px; display: grid; place-items: center; }
ol.steps b { font-weight: 600; }
ol.steps p { color: var(--muted); font-size: 14px; }
.when { font-family: var(--f-mono); font-size: 12px; color: var(--ink); background: var(--lane); border-radius: 4px; padding: 1px 6px; }
/* "How it works" pop-up */
.bar-in .info-btn:first-of-type { margin-left: auto; }
.info-btn { display: inline-flex; gap: 8px; align-items: center; font: 600 13px var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px 5px 6px; cursor: pointer; }
.info-btn:hover { border-color: var(--accent); }
.info-btn i { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--surface); font: italic 700 13px/20px Georgia, "Times New Roman", serif; text-align: center; }
.howto { width: min(1120px, calc(100% - 32px)); max-height: 88vh; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); overflow: auto; }
.howto::backdrop { background: rgba(8, 14, 12, 0.55); backdrop-filter: blur(2px); }
.howto-head { position: sticky; top: 0; z-index: 1; background: var(--surface); border-bottom: 1px solid var(--line); padding: 18px 24px; display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
.howto-head .eyebrow { margin: 0 0 4px; }
.howto-head h2 { font-size: 22px; }
.howto-close { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 18px; line-height: 1; cursor: pointer; }
.howto-close:hover { border-color: var(--ink); }
.howto .cols { padding: 24px; }
.part { width: min(880px, calc(100% - 32px)); }
.part::backdrop { background: rgba(8, 14, 12, 0.22); backdrop-filter: none; }
.part .detail { border: 0; border-radius: 0; background: none; padding: 26px 28px 28px; }
.part-close { position: sticky; top: 14px; float: right; margin: 14px 14px -48px 0; z-index: 2; }
.howto > .stack { padding: 24px; }
.info-btn i.code { font: 600 9px/20px var(--f-mono); font-style: normal; letter-spacing: -0.04em; }
@media (prefers-reduced-motion: no-preference) { .howto[open] { animation: pop .18s ease-out; } @keyframes pop { from { opacity: 0; transform: translateY(8px); } } }
.callout { border-left: 3px solid var(--audio); padding: 4px 0 4px 16px; max-width: 68ch; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 760px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 500; }
td.mono { font-family: var(--f-mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.foot { font-size: 13px; color: var(--muted); max-width: 80ch; }
/* top bar (from the Signal Path layout): name + camera/firmware dropdowns, sticky */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.bar-in { max-width: 1240px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; justify-content: space-between; }
.brand { display: flex; gap: 10px; align-items: center; font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: -0.005em; }
.brand i { width: 14px; height: 14px; border: 2px solid var(--accent); border-radius: 50%; position: relative; flex: none; }
.brand i::after { content: ""; position: absolute; inset: 3px; background: var(--accent); border-radius: 50%; }
.pick { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.pick label { display: flex; gap: 8px; align-items: center; font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.pick select { font: 500 13px var(--f-mono); text-transform: none; letter-spacing: 0; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; max-width: 62vw; }
/* intro: camera + firmware line and hardware chips */
.intro { display: grid; gap: 10px; }
.intro .eyebrow { margin: 0; }
.spec { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.spec li { font-family: var(--f-mono); font-size: 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px 8px; }
.spec li b { color: var(--muted); font-weight: 500; margin-right: 6px; text-transform: uppercase; font-size: 10px; letter-spacing: 0.08em; }
footer { font-size: 12px; color: var(--muted); font-family: var(--f-mono); border-top: 1px solid var(--line); padding-top: 16px; }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand"><i></i><span id="brand"></span></div>
    <button type="button" class="info-btn" data-open="howto" aria-haspopup="dialog"><i aria-hidden="true">i</i>How it works</button>
    <button type="button" class="info-btn" data-open="sources" aria-haspopup="dialog"><i class="code" aria-hidden="true">&lt;/&gt;</i>Sources</button>
    <div class="pick">
      <label for="pick-camera">Camera <select id="pick-camera"></select></label>
      <label for="pick-version">Firmware <select id="pick-version"></select></label>
    </div>
  </div>
</header>

<div class="wrap">
  <section class="intro" aria-label="Camera and firmware">
    <p class="eyebrow" id="eyebrow"></p>
    <ul class="spec" id="spec"></ul>
  </section>

  <section class="diagram" aria-label="Architecture diagram">
    <div class="toolbar">
      <div class="filters" role="group" aria-label="Show flows">
        <button type="button" data-f="all" aria-pressed="true">All flows</button>
        <button type="button" data-f="video" aria-pressed="false"><i class="sw" style="color:var(--video)"></i>Video</button>
        <button type="button" data-f="audio" aria-pressed="false"><i class="sw" style="color:var(--audio)"></i>Audio</button>
        <button type="button" data-f="control" aria-pressed="false"><i class="sw dash" style="color:var(--control)"></i>Control</button>
        <button type="button" data-f="detect" aria-pressed="false"><i class="sw" style="color:var(--detect)"></i>Motion</button>
      </div>
      <p class="hint">Click a box for its details. Click empty space to clear the highlight.</p>
    </div>
    <div class="canvas-scroll"><canvas id="cv" role="img" aria-label="Architecture diagram: click a box for details, or use the list below it"></canvas></div>
  </section>

  <footer id="footer"></footer>
</div>

<dialog class="howto" id="howto" aria-labelledby="howto-title">
  <div class="howto-head">
    <div>
      <p class="eyebrow">How it works</p>
      <h2 id="howto-title">From light to your network, and how the camera boots</h2>
    </div>
    <button type="button" class="howto-close" data-close aria-label="Close">×</button>
  </div>
  <div class="cols">
    <section>
      <h2>A frame's journey</h2>
      <ol class="steps" id="journey"></ol>
      <p class="callout" id="callout"></p>
    </section>
    <section>
      <h2>How it boots</h2>
      <ol class="steps" id="boot"></ol>
      <p class="foot" id="boot-foot"></p>
    </section>
  </div>
</dialog>

<dialog class="howto part" id="part" aria-labelledby="part-title">
  <button type="button" class="howto-close part-close" data-close aria-label="Close">×</button>
  <article class="detail" id="detail" aria-live="polite"></article>
</dialog>

<dialog class="howto" id="sources" aria-labelledby="sources-title">
  <div class="howto-head">
    <div>
      <p class="eyebrow">Sources</p>
      <h2 id="sources-title">Where each piece comes from</h2>
    </div>
    <button type="button" class="howto-close" data-close aria-label="Close">×</button>
  </div>
  <section class="stack">
    <p class="prose" id="repos-intro"></p>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Piece</th><th>Upstream repo</th><th>Pinned</th><th>What it provides</th></tr></thead>
        <tbody id="repos"></tbody>
      </table>
    </div>
    <p class="foot" id="repos-foot"></p>
  </section>
</dialog>

<script>/*__CORE__*/</script>
<script>
const DATA = /*__DATA__*/null;
(() => {
  const D = DATA;
  // ---------- layout constants (diagram units) ----------
  const VW = 1180, X0 = 156, XW = 1008, TOP = 18, LANE_GAP = 10, INSET = 10, MIN_CSS_W = 860;
  const $ = id => document.getElementById(id);

  // ---------- current view (rules shared with the other layouts in core.js) ----------
  let cam = D.cameras[0], ver = D.versions[0];
  const supports = TC.supports;
  const visible = it => TC.visible(it, cam, ver);
  const resolve = it => TC.resolve(it, cam, ver);
  const fill = s => TC.fill(s, cam, ver);
  const { esc, md } = TC;

  // ---------- pickers ----------
  const camSel = $('pick-camera'), verSel = $('pick-version');
  const groups = [...new Set(D.cameras.map(c => c.group || c.name))];
  camSel.innerHTML = groups.map(g => `<optgroup label="${esc(g)}">${D.cameras.filter(c => (c.group || c.name) === g)
    .map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</optgroup>`).join('');
  function fillVersions() {
    verSel.innerHTML = D.versions.map(v => `<option value="${esc(v.id)}"${supports(cam, v) ? '' : ' disabled'}>${esc(v.name)} ${esc(v.codename || '')} · ${esc(v.core || '')}${supports(cam, v) ? '' : ' (no config)'}</option>`).join('');
    verSel.value = ver.id; camSel.value = cam.id;
  }
  function setView(cid, vid, keepSel) {
    cam = D.cameras.find(c => c.id === cid) || D.cameras[0];
    ver = D.versions.find(v => v.id === vid) || ver;
    if (!supports(cam, ver)) ver = D.versions.find(v => supports(cam, v)) || D.versions[0];
    fillVersions();
    try { history.replaceState(null, '', '#' + cam.id + '+' + ver.id); } catch (e) { /* file:// in some browsers */ }
    rebuild(keepSel);
  }
  camSel.addEventListener('change', () => setView(camSel.value, ver.id, true));
  verSel.addEventListener('change', () => setView(cam.id, verSel.value, true));
  window.addEventListener('hashchange', () => { const [c, v] = TC.parseHash(); if (c && (c !== cam.id || v !== ver.id)) setView(c, v, true); });

  // ---------- model for the current view ----------
  let page, LANES, LI, nodes, byId, E, VH, repoById;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function bez(p, t) {
    const u = 1 - t, a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
    return [a * p[0][0] + b * p[1][0] + c * p[2][0] + d * p[3][0], a * p[0][1] + b * p[1][1] + c * p[2][1] + d * p[3][1]];
  }

  function rebuild(keepSel) {
    page = resolve(D.page);
    // lanes + nodes
    LANES = D.lanes.filter(visible).map(l => resolve(l)).map(l => ({ ...l, height: l.height || 76, shape: l.shape || 'box' }));
    const laneIds = new Set(LANES.map(l => l.id));
    nodes = D.nodes.filter(n => laneIds.has(n.lane) && visible(n)).map(resolve);
    LANES = LANES.filter(L => nodes.some(n => n.lane === L.id));   // drop empty lanes
    let y = TOP;
    LANES.forEach(L => { L.y = y; y += L.height + LANE_GAP; });
    VH = y - LANE_GAP + TOP;
    LI = Object.fromEntries(LANES.map((l, i) => [l.id, i]));
    for (const L of LANES) {
      const ln = nodes.filter(n => n.lane === L.id);
      let nxt = 0, end = 0;
      ln.forEach(n => { n._col = n.col ?? nxt; n._span = n.span || 1; nxt = n._col + n._span; end = Math.max(end, nxt); });
      const cols = L.cols === 'auto' ? Math.max(end, L.min_cols || 1) : L.cols;
      const cw = XW / cols, gap = cols === 1 ? 0 : Math.min(20, cw * 0.125);
      ln.forEach(n => {
        n.x = X0 + n._col * cw; n.w = n._span * cw - gap;
        n.y = L.y + INSET; n.h = L.height - INSET * 2; n.cx = n.x + n.w / 2; n.shape = L.shape;
        n.starts = n.starts ?? L.default_starts;
        n.upstream = n.upstream ?? L.default_upstream ?? [];
        n.note = n.note ?? L.note;
      });
    }
    byId = Object.fromEntries(nodes.map(n => [n.id, n]));
    // edges
    E = D.edges.filter(e => visible(e) && byId[e.from] && byId[e.to]).map(e => {
      const r = resolve(e);
      return { f: r.from, t: r.to, k: r.kind, l: r.label, arc: r.arc };
    });
    E.forEach(e => {
      const a = byId[e.f], b = byId[e.t], la = LI[a.lane], lb = LI[b.lane];
      let p;
      if (la === lb) {
        const up = e.arc !== 'down';
        const ya = up ? a.y : a.y + a.h, yb = up ? b.y : b.y + b.h;
        const lift = Math.min(70, 18 + Math.abs(a.cx - b.cx) * 0.12) * (up ? -1 : 1);
        const xa = a.cx + (b.cx > a.cx ? a.w * 0.3 : -a.w * 0.3), xb = b.cx + (a.cx > b.cx ? b.w * 0.3 : -b.w * 0.3);
        p = [[xa, ya], [xa, ya + lift], [xb, yb + lift], [xb, yb]];
      } else {
        const down = la < lb;
        const ox = (n, o) => clamp((o.cx - n.cx) * 0.22, -n.w * 0.38, n.w * 0.38);
        const xa = a.cx + ox(a, b), xb = b.cx + ox(b, a);
        const ya = down ? a.y + a.h : a.y, yb = down ? b.y : b.y + b.h, dy = (yb - ya) * 0.5;
        p = [[xa, ya], [xa, ya + dy], [xb, yb - dy], [xb, yb]];
      }
      e.p = p;
      let len = 0, prev = p[0];
      for (let i = 1; i <= 16; i++) { const q = bez(p, i / 16); len += Math.hypot(q[0] - prev[0], q[1] - prev[1]); prev = q; }
      e.len = len;
    });
    // repos
    const repos = D.repos.filter(visible).map(r => ({ ...resolve(r), pin: (r.pins && r.pins[ver.id]) || (r.pin ? fill(r.pin) : '') }));
    repoById = Object.fromEntries(repos.map(r => [r.id, r]));

    // page text
    document.title = page.title;
    $('brand').textContent = page.title;
    $('eyebrow').textContent = page.eyebrow || '';
    $('spec').innerHTML = TC.specRows(page).map(([k, v]) => `<li><b>${esc(k)}</b>${esc(TC.plain(v))}</li>`).join('');
    $('callout').innerHTML = md(page.callout || '');
    $('boot-foot').innerHTML = md(page.boot_foot || '');
    $('repos-intro').innerHTML = md(page.repos_intro || '') + (ver.pins_source ? ' Pins for ' + esc(ver.name) + ' come from ' + md(ver.pins_source) + '.' : '');
    $('repos-foot').innerHTML = md(page.repos_foot || '');
    $('journey').innerHTML = (D.journey || []).filter(visible).map(resolve).map(j => `<li><div><b>${md(j.title)}</b><p>${md(j.text)}</p></div></li>`).join('');
    $('boot').innerHTML = (D.boot || []).filter(visible).map(resolve).map(b => `<li><div><b>${md(b.title)}</b>${b.when ? ` <span class="when">${esc(b.when)}</span>` : ''}<p>${md(b.text)}</p></div></li>`).join('');
    $('repos').innerHTML = repos.filter(r => r.table !== false).map(r =>
      `<tr><td>${esc(r.piece)}</td><td><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a></td><td class="mono">${esc(r.pin || '–')}</td><td>${md(r.what)}</td></tr>`).join('');
    $('footer').textContent = `Built ${D.meta.built} from architecture.toml · ${cam.name} + ${ver.name}: ${nodes.length} parts, ${E.length} connections · ${D.cameras.length} cameras × ${D.versions.length} versions in the data`;

    if (!(keepSel && byId[sel])) sel = byId[page.default_selection] ? page.default_selection : null;
    hover = null;
    size(); select(sel); paint(performance.now());
  }

  // ---------- drawing ----------
  let sel = null, filter = 'all', hover = null;
  const cv = $('cv'), ctx = cv.getContext('2d');
  let scale = 1, dpr = 1;
  const C = {}, F = {};
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    ['surface', 'lane', 'ink', 'muted', 'line', 'video', 'audio', 'control', 'detect', 'accent'].forEach(k => C[k] = cs.getPropertyValue('--' + k).trim());
    C.mixed = C.ink;
    ['display', 'body', 'mono'].forEach(k => F[k] = cs.getPropertyValue('--f-' + k).trim());
  }
  function size() {
    const cssW = Math.max(cv.parentElement.clientWidth, MIN_CSS_W);
    scale = cssW / VW; dpr = window.devicePixelRatio || 1;
    cv.style.width = cssW + 'px'; cv.style.height = (VH * scale) + 'px';
    cv.width = Math.round(cssW * dpr); cv.height = Math.round(VH * scale * dpr);
  }
  const connected = id => new Set(E.filter(e => e.f === id || e.t === id).flatMap(e => [e.f, e.t]));
  const shown = e => filter === 'all' || e.k === filter || e.k === 'mixed';
  function alpha(hex, a) {
    const m = hex.replace('#', ''), v = m.length === 3 ? m.split('').map(c => c + c).join('') : m, n = parseInt(v, 16);
    return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
  }
  function fit(text, max) {
    if (ctx.measureText(text).width <= max) return text;
    let t = text; while (t.length > 1 && ctx.measureText(t + '…').width > max) t = t.slice(0, -1);
    return t + '…';
  }
  function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }

  const t0 = performance.now();
  let looping = false;
  function frame(now) { paint(now); if (!reduce.matches) requestAnimationFrame(frame); else looping = false; }
  function startLoop() { if (!looping && !reduce.matches) { looping = true; requestAnimationFrame(frame); } }
  const redraw = () => { if (reduce.matches) paint(performance.now()); };

  function paint(now) {
    if (!LANES) return;
    const time = (now - t0) / 1000;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    ctx.fillStyle = C.surface; ctx.fillRect(0, 0, VW, VH);
    LANES.forEach((L, i) => {
      ctx.fillStyle = i % 2 ? C.surface : C.lane;
      ctx.fillRect(0, L.y - LANE_GAP / 2, VW, L.height + LANE_GAP);
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = C.ink; ctx.font = '600 13px ' + F.display;
      ctx.fillText(fit(L.label, X0 - 24), 16, L.y + L.height / 2 - 2);
      ctx.fillStyle = C.muted; ctx.font = '11px ' + F.mono;
      ctx.fillText(fit(L.sub || '', X0 - 24), 16, L.y + L.height / 2 + 14);
    });
    const focus = sel ? connected(sel) : null;
    E.forEach(e => {
      const on = shown(e), hl = sel && (e.f === sel || e.t === sel);
      const a = on ? (sel ? (hl ? 0.95 : 0.1) : 0.5) : 0.05, col = C[e.k] || C.ink, p = e.p;
      ctx.strokeStyle = alpha(col, a); ctx.lineWidth = hl ? 2.2 : 1.4;
      ctx.setLineDash(e.k === 'control' ? [5, 4] : []);
      ctx.beginPath(); ctx.moveTo(...p[0]); ctx.bezierCurveTo(...p[1], ...p[2], ...p[3]); ctx.stroke();
      ctx.setLineDash([]);
      const q = bez(p, 0.97), end = p[3], ang = Math.atan2(end[1] - q[1], end[0] - q[0]);
      ctx.fillStyle = alpha(col, a); ctx.beginPath(); ctx.moveTo(...end);
      ctx.lineTo(end[0] - 7 * Math.cos(ang - 0.45), end[1] - 7 * Math.sin(ang - 0.45));
      ctx.lineTo(end[0] - 7 * Math.cos(ang + 0.45), end[1] - 7 * Math.sin(ang + 0.45));
      ctx.fill();
      if (on && (!sel || hl) && !reduce.matches) {
        const k = Math.max(1, Math.round(e.len / 140));
        for (let i = 0; i < k; i++) {
          const pt = bez(p, ((time * 55) / e.len + i / k) % 1);
          ctx.fillStyle = alpha(col, hl ? 1 : 0.8);
          ctx.beginPath(); ctx.arc(pt[0], pt[1], hl ? 3 : 2.2, 0, Math.PI * 2); ctx.fill();
        }
      }
    });
    nodes.forEach(n => {
      const L = LANES[LI[n.lane]];
      ctx.globalAlpha = focus && !focus.has(n.id) ? 0.35 : 1;
      const isSel = n.id === sel, isHover = n.id === hover;
      const strong = L.emphasis || n.kind || n.color;
      const edge = n.color ? C[n.color] : n.kind ? C[n.kind] : L.emphasis ? C.accent : C.line;
      rr(n.x, n.y, n.w, n.h, n.shape === 'box' ? 7 : n.shape === 'band' ? 6 : n.h / 2);
      ctx.fillStyle = n.shape === 'band' ? C.lane : C.surface; ctx.fill();
      ctx.lineWidth = isSel ? 2.5 : isHover ? 2 : strong ? 1.6 : 1.1;
      ctx.strokeStyle = isSel ? C.ink : isHover ? C.muted : edge;
      if (n.shape === 'band') ctx.setLineDash([3, 3]);
      ctx.stroke(); ctx.setLineDash([]);
      ctx.textAlign = 'center';
      const maxW = n.w - 20;
      if (n.sub) {
        ctx.fillStyle = C.ink;
        ctx.font = n.shape === 'pill' ? '500 13px ' + F.mono : (L.id === 'prod' || L.id === 'cons') ? '600 15px ' + F.mono : '600 13px ' + F.body;
        ctx.fillText(fit(n.title, maxW), n.cx, n.y + n.h / 2 - 2);
        ctx.fillStyle = C.muted; ctx.font = '11px ' + F.body;
        ctx.fillText(fit(n.sub, maxW), n.cx, n.y + n.h / 2 + 13);
      } else {
        ctx.fillStyle = C.ink; ctx.font = '500 13px ' + F.body;
        ctx.fillText(fit(n.title, maxW), n.cx, n.y + n.h / 2 + 5);
      }
      ctx.globalAlpha = 1;
    });
  }

  // ---------- detail card ----------
  const det = $('detail');
  function renderDetail() {
    if (!sel || !byId[sel]) { det.innerHTML = ''; return; }
    const n = byId[sel], L = LANES[LI[n.lane]];
    const tagCol = n.kind ? `var(--${n.kind})` : L.emphasis ? 'var(--accent)' : 'var(--muted)';
    const li = (e, dir) => {
      const o = byId[dir === 'in' ? e.f : e.t];
      return `<li><button class="conn" data-go="${esc(o.id)}"><span class="dir">${dir === 'in' ? '←' : '→'}</span><span class="k" style="background:var(--${e.k === 'mixed' ? 'ink' : e.k})"></span><span><b>${esc(o.title)}</b> · ${esc(e.l)}</span></button></li>`;
    };
    const ups = n.upstream.map(id => repoById[id]).filter(Boolean)
      .map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a>${r.pin ? ` <span class="pin">${esc(r.pin)}</span>` : ''}</li>`).join('');
    const links = [...E.filter(e => e.t === n.id).map(e => li(e, 'in')), ...E.filter(e => e.f === n.id).map(e => li(e, 'out'))].join('');
    det.innerHTML = `
      <div class="d-head"><span class="tag" style="color:${tagCol}">${esc(L.tag || L.label)}</span>
        <h3 id="part-title">${esc(n.title)}</h3>${n.sub ? `<p class="d-sub">${esc(n.sub)}</p>` : ''}</div>
      <div class="d-grid">
        <div><h4>What it does</h4><p>${md(n.about)}</p>${n.note ? `<p class="d-sub">${md(n.note)}</p>` : ''}${n.file ? `<p class="d-sub"><code>${esc(n.file)}</code></p>` : ''}</div>
        <div><h4>How it starts</h4><p>${md(n.starts || '')}</p>${ups ? `<h4 style="margin-top:8px">Upstream</h4><ul>${ups}</ul>` : ''}</div>
        <div><h4>Talks to</h4><ul>${links || '<li class="d-sub">Nothing drawn</li>'}</ul></div>
      </div>`;
  }
  det.addEventListener('click', ev => { const b = ev.target.closest('[data-go]'); if (b) { select(b.dataset.go, true); $('part').scrollTop = 0; } });

  // show = open the part pop-up (a click); without it (camera/version switch) the pop-up only closes if its part is gone
  function select(id, show) {
    sel = id; renderDetail();
    redraw();
    const dlg = $('part');
    if (sel && show && !dlg.open) dlg.showModal();
    if (!sel && dlg.open) dlg.close();
  }
  function hit(ev) {
    const r = cv.getBoundingClientRect(), x = (ev.clientX - r.left) / scale, y = (ev.clientY - r.top) / scale;
    for (let i = nodes.length - 1; i >= 0; i--) { const n = nodes[i]; if (x >= n.x && x <= n.x + n.w && y >= n.y && y <= n.y + n.h) return n.id; }
    return null;
  }
  cv.addEventListener('click', ev => select(hit(ev), true));
  cv.addEventListener('mousemove', ev => { const h = hit(ev); if (h !== hover) { hover = h; cv.style.cursor = h ? 'pointer' : 'default'; redraw(); } });
  document.querySelectorAll('.filters button').forEach(b => b.addEventListener('click', () => {
    filter = b.dataset.f;
    document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    redraw();
  }));
  // Pop-ups ("How it works", "Sources"): [data-open="<dialog id>"] opens, [data-close] or a backdrop click closes
  document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => $(b.dataset.open).showModal()));
  document.querySelectorAll('dialog.howto').forEach(d => d.addEventListener('click', ev => {
    if (ev.target === d || ev.target.closest('[data-close]')) d.close();
  }));

  const refresh = () => { readColors(); redraw(); };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', refresh);
  new MutationObserver(refresh).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  window.addEventListener('resize', () => { size(); redraw(); });
  reduce.addEventListener('change', () => { startLoop(); redraw(); });

  readColors();
  const [hc, hv] = TC.parseHash();
  setView(hc || cam.id, hv || ver.id, false);
  startLoop();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { readColors(); redraw(); });
})();
</script>
</body>
</html>
